<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Saldi Book - Profit Tracker</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#0b1220;--panel:#111827;--panel2:#1e293b;--line:#334155;--text:#fff;--muted:#cbd5e1;--green:#22c55e;--red:#ef4444;--blue:#2563eb;--yellow:#facc15}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(180deg,#0b1220,#111827);color:var(--text);min-height:100vh}.app{max-width:1100px;margin:auto;padding:28px 16px 60px}.hero,.box,.stat{background:rgba(17,24,39,.97);border:1px solid var(--line);border-radius:18px;padding:20px;margin-bottom:16px}.hero{background:linear-gradient(135deg,#172554,#111827)}h1,h2,h3{margin-top:0}.muted{color:var(--muted)}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.stat .label{color:var(--muted);font-size:12px;text-transform:uppercase}.stat .value{font-size:29px;font-weight:900;margin-top:7px}.field{margin-bottom:13px}label{display:block;margin-bottom:6px;color:#e2e8f0;font-weight:bold;font-size:13px}input,select,button{width:100%;padding:12px;border-radius:10px;font-size:15px}input,select{background:#020617;color:white;border:1px solid var(--line)}button{border:0;cursor:pointer;font-weight:bold}.green{background:var(--green);color:#052e16}.gray{background:#334155;color:white}.red{background:#b91c1c;color:white}.blue{background:var(--blue);color:white}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{width:auto}.user-card{background:#0f172a;border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px}.user-head{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}.user-total{font-size:21px;font-weight:900;color:#86efac}.book-row{display:grid;grid-template-columns:1fr 150px 190px;gap:10px;align-items:center;padding:11px 0;border-top:1px solid rgba(255,255,255,.07)}.book-name{font-weight:800}.balance{font-size:18px;font-weight:900}.note{color:var(--muted);font-size:12px;margin-top:3px}.msg{margin-top:10px;color:var(--muted)}@media(max-width:750px){.grid,.stats{grid-template-columns:1fr}.book-row{grid-template-columns:1fr}.actions button{width:100%}}
</style>
</head>
<body>
<div class="app">
 <div class="hero"><h1>💰 Saldi Book</h1><div class="muted">Area privata collegata al tuo account Profit Tracker</div></div>
 <div id="authBox" class="box hidden"><h3>Accesso richiesto</h3><p class="muted">Accedi prima dal Profit Tracker principale con lo stesso account.</p><button class="gray" onclick="location.href='index.html'">← Vai al Profit Tracker</button></div>
 <div id="content" class="hidden">
  <div class="stats"><div class="stat"><div class="label">Totale sui book</div><div id="grandTotal" class="value">€ 0,00</div></div><div class="stat"><div class="label">Utenti / profili</div><div id="usersCount" class="value">0</div></div><div class="stat"><div class="label">Conti bookmaker</div><div id="booksCount" class="value">0</div></div></div>
  <div class="box"><h3 id="formTitle">Aggiungi saldo bookmaker</h3><div class="grid"><div class="field"><label>Utente / Nome</label><input id="profile" placeholder="es. Andrea"></div><div class="field"><label>Bookmaker</label><input id="book" placeholder="es. Sisal"></div><div class="field"><label>Saldo €</label><input id="balance" type="number" step="0.01" placeholder="0.00"></div></div><div class="field"><label>Nota facoltativa</label><input id="note" placeholder="es. conto 1, promo, telefono..."></div><div class="actions"><button class="green" onclick="saveItem()">Salva</button><button id="cancelBtn" class="gray hidden" onclick="cancelEdit()">Annulla modifica</button></div><div id="msg" class="msg">—</div></div>
  <div class="box"><div class="grid"><div class="field"><label>Filtra utente</label><select id="filter" onchange="render()"><option value="">Tutti</option></select></div><div></div><div style="display:flex;align-items:end"><button class="gray" onclick="location.href='index.html'">← Torna agli strumenti</button></div></div><div id="list"></div></div>
 </div>
</div>
<script>
const supabaseClient=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');
let currentUser=null;let items=[];let editingId=null;
const euro=v=>'€ '+Number(v||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
function uid(){return (crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2))}
function normalize(raw){return Array.isArray(raw)?raw.map(x=>({id:String(x.id||uid()),profile:String(x.profile||'').trim(),book:String(x.book||'').trim(),balance:Number(x.balance||0),note:String(x.note||'').trim()})).filter(x=>x.profile&&x.book):[]}
async function boot(){const {data}=await supabaseClient.auth.getUser();currentUser=data?.user||null;if(!currentUser){document.getElementById('authBox').classList.remove('hidden');return}items=normalize(currentUser.user_metadata?.book_balances);document.getElementById('content').classList.remove('hidden');render()}
async function persist(){const {data,error}=await supabaseClient.auth.updateUser({data:{book_balances:items}});if(error)throw error;currentUser=data.user}
async function saveItem(){const profile=document.getElementById('profile').value.trim(),book=document.getElementById('book').value.trim(),balance=Number(document.getElementById('balance').value||0),note=document.getElementById('note').value.trim(),msg=document.getElementById('msg');if(!profile||!book){msg.textContent='Inserisci utente e bookmaker.';return}if(balance<0){msg.textContent='Il saldo non può essere negativo.';return}msg.textContent='Salvataggio...';if(editingId){const i=items.findIndex(x=>x.id===editingId);if(i>=0)items[i]={...items[i],profile,book,balance,note}}else{items.push({id:uid(),profile,book,balance,note})}try{await persist();msg.textContent='Saldo salvato.';resetForm();render()}catch(e){msg.textContent=e.message||'Errore salvataggio'} }
function editItem(id){const x=items.find(v=>v.id===id);if(!x)return;editingId=id;document.getElementById('profile').value=x.profile;document.getElementById('book').value=x.book;document.getElementById('balance').value=x.balance;document.getElementById('note').value=x.note;document.getElementById('formTitle').textContent='Modifica saldo bookmaker';document.getElementById('cancelBtn').classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}
async function deleteItem(id){if(!confirm('Eliminare questo saldo bookmaker?'))return;const old=items;items=items.filter(x=>x.id!==id);try{await persist();render()}catch(e){items=old;alert(e.message||'Errore eliminazione')}}
function cancelEdit(){resetForm()}
function resetForm(){editingId=null;document.getElementById('profile').value='';document.getElementById('book').value='';document.getElementById('balance').value='';document.getElementById('note').value='';document.getElementById('formTitle').textContent='Aggiungi saldo bookmaker';document.getElementById('cancelBtn').classList.add('hidden')}
function render(){const profiles=[...new Set(items.map(x=>x.profile))].sort((a,b)=>a.localeCompare(b,'it'));const f=document.getElementById('filter'),selected=f.value;f.innerHTML='<option value="">Tutti</option>'+profiles.map(p=>`<option ${p===selected?'selected':''}>${escapeHtml(p)}</option>`).join('');document.getElementById('grandTotal').textContent=euro(items.reduce((s,x)=>s+x.balance,0));document.getElementById('usersCount').textContent=profiles.length;document.getElementById('booksCount').textContent=items.length;const show=selected?profiles.filter(p=>p===selected):profiles;const list=document.getElementById('list');if(!show.length){list.innerHTML='<div class="muted">Nessun saldo inserito.</div>';return}list.innerHTML=show.map(p=>{const rows=items.filter(x=>x.profile===p).sort((a,b)=>a.book.localeCompare(b.book,'it')),tot=rows.reduce((s,x)=>s+x.balance,0);return `<div class="user-card"><div class="user-head"><h3 style="margin:0">👤 ${escapeHtml(p)}</h3><div class="user-total">${euro(tot)}</div></div>${rows.map(x=>`<div class="book-row"><div><div class="book-name">${escapeHtml(x.book)}</div>${x.note?`<div class="note">${escapeHtml(x.note)}</div>`:''}</div><div class="balance">${euro(x.balance)}</div><div class="actions"><button class="blue" onclick="editItem('${x.id}')">Modifica</button><button class="red" onclick="deleteItem('${x.id}')">Elimina</button></div></div>`).join('')}</div>`}).join('')}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
boot();
</script>
</body></html>
