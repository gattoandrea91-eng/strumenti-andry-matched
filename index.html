    <!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Strumenti Andry Matched</title>

  <style>
    :root{
      --bg:#0b1220;
      --bg2:#111827;
      --panel:#111827;
      --panel2:#1e293b;
      --line:#334155;
      --lineSoft:rgba(255,255,255,.08);
      --text:#ffffff;
      --muted:#cbd5e1;
      --green:#22c55e;
      --green2:#16a34a;
      --greenSoft:rgba(34,197,94,.12);
      --red:#ef4444;
      --red2:#b91c1c;
      --redSoft:rgba(239,68,68,.12);
      --blue:#2563eb;
      --blueSoft:rgba(37,99,235,.16);
      --gold:#fbbf24;
      --darkInput:#020617;
      --shadow:0 16px 36px rgba(0,0,0,.22);
      --radius:20px;
    }

    *{box-sizing:border-box}

    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:linear-gradient(180deg,var(--bg) 0%, var(--bg2) 100%);
      color:var(--text);
    }

    .container{
      max-width:1150px;
      margin:auto;
      padding:32px 18px 70px;
    }

    .topbar{
      text-align:center;
      margin-bottom:28px;
    }

    h1{
      margin:0;
      font-size:42px;
    }

    .subtitle{
      color:var(--muted);
      margin:10px 0 0;
    }

    .menu{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:16px;
      max-width:920px;
      margin:0 auto;
    }

    .menu button{
      padding:22px 18px;
      border-radius:18px;
      border:1px solid var(--line);
      background:linear-gradient(180deg,#1f2937 0%, #111827 100%);
      color:white;
      font-size:20px;
      font-weight:bold;
      cursor:pointer;
      box-shadow:0 12px 24px rgba(0,0,0,.18);
      transition:all .18s ease;
    }

    .menu button:hover{
      border-color:#475569;
      transform:translateY(-1px);
    }

    .section{
      display:none;
      margin-top:18px;
    }

    .section-wrap{
      max-width:1020px;
      margin:0 auto;
    }

    .section-header{
      margin-bottom:18px;
      text-align:center;
    }

    .section-header h2{
      margin:0 0 8px;
      font-size:34px;
    }

    .section-header p{
      margin:0;
      color:var(--muted);
    }

    .hero-bonus,
    .hero-blackjack,
    .hero-crypto,
    .hero-profit{
      max-width:1020px;
      margin:0 auto 18px;
      border-radius:22px;
      overflow:hidden;
      box-shadow:0 18px 38px rgba(0,0,0,.24);
      border:1px solid var(--line);
    }

    .hero-bonus{
      padding:28px;
      background:
        linear-gradient(rgba(10,20,40,.72), rgba(10,20,40,.82)),
        url('https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=1400&q=80') center/cover;
    }

    .hero-blackjack{
      padding:32px 28px;
      background:
        radial-gradient(circle at center, rgba(22,101,52,.28), rgba(0,0,0,.45)),
        linear-gradient(rgba(0,0,0,.22), rgba(0,0,0,.42)),
        url('https://images.unsplash.com/photo-1511193311914-0346f16efe90?auto=format&fit=crop&w=1400&q=80') center/cover;
      border:1px solid rgba(255,255,255,.12);
    }

    .hero-crypto{
      padding:26px;
      background:
        linear-gradient(rgba(8,15,30,.76), rgba(8,15,30,.9)),
        url('https://images.unsplash.com/photo-1621761191319-c6fb62004040?auto=format&fit=crop&w=1400&q=80') center/cover;
    }

    .hero-profit{
      padding:28px;
      background:
        linear-gradient(rgba(8,15,30,.72), rgba(8,15,30,.92)),
        url('https://images.unsplash.com/photo-1554224155-6726b3ff858f?auto=format&fit=crop&w=1400&q=80') center/cover;
    }

    .hero-profit-inner{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:20px;
      flex-wrap:wrap;
    }

    .profit-brand{
      display:flex;
      align-items:center;
      gap:16px;
    }

    .profit-logo{
      width:74px;
      height:74px;
      border-radius:22px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:28px;
      font-weight:800;
      letter-spacing:.05em;
      color:#fff;
      background:linear-gradient(135deg,#2563eb 0%, #111827 100%);
      border:1px solid rgba(255,255,255,.18);
      box-shadow:0 10px 24px rgba(0,0,0,.22);
    }

    .profit-brand-text h3{
      margin:0 0 6px;
      font-size:30px;
      color:#fff;
    }

    .profit-brand-text p{
      margin:0;
      color:#e2e8f0;
      font-size:15px;
    }

    .profit-mini-pill,
    .blackjack-chip{
      display:inline-block;
      margin-top:10px;
      padding:8px 14px;
      border-radius:999px;
      font-size:14px;
      font-weight:bold;
    }

    .profit-mini-pill{
      background:var(--blueSoft);
      border:1px solid rgba(37,99,235,.35);
      color:#bfdbfe;
    }

    .blackjack-chip{
      background:rgba(251,191,36,.18);
      border:1px solid rgba(251,191,36,.35);
      color:#fde68a;
    }

    .hero-bonus h3,
    .hero-blackjack h3,
    .hero-crypto h3{
      margin:0 0 8px;
      font-size:30px;
      color:#fff;
    }

    .hero-blackjack p,
    .hero-crypto p{
      margin:0;
      color:#f8fafc;
    }

    .card-grid{
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:18px;
    }

    .profit-layout{
      display:grid;
      grid-template-columns:1.1fr .9fr;
      gap:18px;
      align-items:start;
    }

    .box,
    .result-box,
    .stat-card,
    .chart-card,
    .crypto-signal-card{
      background:rgba(17,24,39,.96);
      border:1px solid var(--line);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }

    .box,
    .result-box{
      padding:28px;
    }

    .stat-card{
      padding:20px;
    }

    .chart-card,
    .crypto-signal-card{
      padding:22px;
      min-height:330px;
    }

    label{
      display:block;
      text-align:left;
      margin:0 0 8px;
      color:#e2e8f0;
      font-size:15px;
      font-weight:bold;
    }

    .field{
      margin-bottom:16px;
    }

    input, select{
      width:100%;
      padding:14px 14px;
      border-radius:12px;
      border:1px solid var(--line);
      background:var(--darkInput);
      color:white;
      font-size:16px;
      outline:none;
    }

    input:focus, select:focus{
      border-color:#4f46e5;
      box-shadow:0 0 0 3px rgba(79,70,229,.14);
    }

    .action,
    .action-secondary,
    .action-danger{
      width:100%;
      padding:16px;
      border-radius:14px;
      border:none;
      cursor:pointer;
      font-weight:bold;
      font-size:18px;
      margin-top:4px;
    }

    .action{
      background:linear-gradient(180deg,var(--green) 0%, var(--green2) 100%);
      color:#052e16;
    }

    .action-secondary{
      background:linear-gradient(180deg,#facc15 0%, #eab308 100%);
      color:#422006;
    }

    .action-danger{
      background:linear-gradient(180deg,#ef4444 0%, #b91c1c 100%);
      color:white;
      margin-top:10px;
    }

    .result{
      margin-top:14px;
      font-size:20px;
      background:var(--panel2);
      padding:16px;
      border-radius:14px;
      border:1px solid var(--line);
    }

    .result strong{
      display:block;
      font-size:14px;
      color:var(--muted);
      margin-bottom:6px;
    }

    .result-value{
      font-size:28px;
      font-weight:bold;
      color:white;
      word-break:break-word;
    }

    .memory-box{
      margin-top:14px;
      font-size:15px;
      line-height:1.6;
      color:var(--muted);
      background:#0f172a;
      padding:16px;
      border-radius:14px;
      border:1px solid var(--line);
    }

    .back{
      display:block;
      margin:20px auto 0;
      padding:14px 22px;
      border-radius:14px;
      border:none;
      background:#334155;
      color:white;
      font-size:16px;
      cursor:pointer;
    }

    .choice-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      margin-top:8px;
    }

    .choice{
      padding:18px;
      border-radius:14px;
      border:1px solid var(--line);
      font-size:20px;
      font-weight:bold;
      color:white;
      text-align:center;
    }

    .player{ background:#1d4ed8; }
    .banker{ background:#b91c1c; }

    .blackjack-card{
      background:linear-gradient(180deg,#14532d 0%, #052e16 100%);
      border:1px solid rgba(255,255,255,.12);
    }

    .crypto-note{
      color:#cbd5e1;
      margin-top:10px;
      font-size:14px;
      line-height:1.5;
    }

    .auth-grid{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
    }

    .stats-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
      margin-bottom:18px;
    }

    .stat-card strong{
      display:block;
      font-size:13px;
      color:var(--muted);
      margin-bottom:10px;
      text-transform:uppercase;
      letter-spacing:.04em;
    }

    .stat-card .value{
      font-size:30px;
      font-weight:bold;
      line-height:1.1;
    }

    .stat-card .sub{
      margin-top:8px;
      font-size:13px;
      color:var(--muted);
    }

    .positive{ color:#4ade80 !important; }
    .negative{ color:#f87171 !important; }
    .neutral{ color:#fff !important; }

    .table-wrap{
      overflow:auto;
      border:1px solid var(--line);
      border-radius:16px;
      background:#0f172a;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th, td{
      padding:14px 12px;
      text-align:left;
      border-bottom:1px solid var(--lineSoft);
      font-size:14px;
      vertical-align:middle;
    }

    th{
      color:#cbd5e1;
      background:#111827;
      position:sticky;
      top:0;
      z-index:1;
      white-space:nowrap;
    }

    .auth-note{
      margin-top:10px;
      color:var(--muted);
      font-size:14px;
    }

    .hidden{ display:none !important; }

    .inline-actions{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
    }

    .small-btn{
      padding:10px 14px;
      border:none;
      border-radius:10px;
      cursor:pointer;
      font-weight:bold;
      background:#334155;
      color:#fff;
    }

    .small-btn.delete{ background:#7f1d1d; }
    .small-btn.logout{ background:#334155; }
    .small-btn.cancel{ background:#475569; }

    .user-pill{
      display:inline-block;
      margin-top:8px;
      padding:8px 14px;
      border-radius:999px;
      background:rgba(37,99,235,.15);
      border:1px solid rgba(37,99,235,.35);
      color:#bfdbfe;
      font-size:14px;
      font-weight:bold;
    }

    .password-row{
      display:flex;
      gap:8px;
      align-items:stretch;
    }

    .password-row input{ flex:1; }

    .toggle-pass{
      min-width:72px;
      border:none;
      border-radius:12px;
      background:#334155;
      color:#fff;
      cursor:pointer;
      font-weight:bold;
      padding:0 12px;
    }

    .link-btn{
      margin-top:10px;
      background:none;
      border:none;
      color:#93c5fd;
      cursor:pointer;
      padding:0;
      font-size:14px;
      text-decoration:underline;
    }

    .two-col{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      margin-top:18px;
    }

    .three-col{
      display:grid;
      grid-template-columns:1fr 1fr 1fr;
      gap:18px;
      margin-top:18px;
    }

    .toolbar-title{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:14px;
      flex-wrap:wrap;
    }

    .toolbar-title h3{
      margin:0;
      font-size:20px;
    }

    .muted{ color:var(--muted); }

    .pill-type{
      display:inline-flex;
      align-items:center;
      padding:6px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      border:1px solid rgba(255,255,255,.12);
      background:rgba(255,255,255,.04);
      white-space:nowrap;
    }

    .profit-badge{
      display:inline-block;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:bold;
      white-space:nowrap;
    }

    .profit-badge.pos{
      background:var(--greenSoft);
      color:#86efac;
      border:1px solid rgba(34,197,94,.22);
    }

    .profit-badge.neg{
      background:var(--redSoft);
      color:#fca5a5;
      border:1px solid rgba(239,68,68,.22);
    }

    .edit-banner{
      margin-bottom:16px;
      padding:12px 14px;
      border-radius:14px;
      background:rgba(37,99,235,.12);
      border:1px solid rgba(37,99,235,.3);
      color:#bfdbfe;
      font-size:14px;
      display:none;
    }

    .service-list{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:14px;
      margin-top:14px;
    }

    .service-card{
      background:#0f172a;
      border:1px solid var(--line);
      border-radius:18px;
      padding:18px;
    }

    .service-icon{
      width:48px;
      height:48px;
      border-radius:14px;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:24px;
      background:rgba(37,99,235,.12);
      border:1px solid rgba(37,99,235,.25);
      margin-bottom:12px;
    }

    .service-card h4{
      margin:0 0 8px;
      font-size:18px;
    }

    .service-meta{
      color:var(--muted);
      font-size:13px;
      margin-bottom:12px;
    }

    .service-panel{
      margin-top:18px;
      padding:20px;
      border-radius:18px;
      background:#0f172a;
      border:1px solid var(--line);
    }

    .service-total{
      margin-bottom:14px;
      padding:16px;
      border-radius:14px;
      background:#111827;
      border:1px solid var(--line);
    }

    canvas{
      width:100% !important;
      height:280px !important;
    }

    @media (max-width:980px){
      .profit-layout{grid-template-columns:1fr;}
      .stats-grid{grid-template-columns:repeat(2,minmax(0,1fr));}
      .two-col, .three-col, .service-list{grid-template-columns:1fr;}
    }

    @media (max-width:850px){
      .menu{grid-template-columns:1fr;}
      .card-grid{grid-template-columns:1fr;}
      .auth-grid{grid-template-columns:1fr;}
      .stats-grid{grid-template-columns:1fr;}
      h1{font-size:34px;}
      .section-header h2{font-size:28px;}
      .hero-bonus h3,
      .hero-blackjack h3,
      .hero-crypto h3,
      .profit-brand-text h3{font-size:26px;}
      .profit-logo{width:62px;height:62px;font-size:24px;}
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="topbar">
      <h1>Strumenti Andry Matched</h1>
      <p class="subtitle">Tool ordinati, puliti e pronti da usare</p>
    </div>

    <div id="menu" class="menu">
      <button onclick="openSection('profitTracker')">Profit Tracker</button>
    </div>
