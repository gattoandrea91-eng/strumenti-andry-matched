<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Strumenti Andry Matched</title>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
text-align:center;
}

.container{
max-width:900px;
margin:auto;
padding:40px;
}

button{
padding:15px;
margin:10px;
font-size:18px;
border:none;
border-radius:10px;
background:#22c55e;
cursor:pointer;
}

input{
padding:10px;
width:100%;
margin-top:10px;
border-radius:8px;
border:none;
}

.box{
background:#111827;
padding:25px;
border-radius:15px;
max-width:400px;
margin:auto;
}

.result{
margin-top:15px;
background:#1e293b;
padding:10px;
border-radius:10px;
}

.section{
display:none;
}

.back{
background:#334155;
}

</style>
</head>

<body>

<div class="container">

<h1>Strumenti Andry Matched</h1>

<div id="menu">

<button onclick="openSection('bonus')">Calcolatore Fun Bonus</button>
<button onclick="openSection('surebet')">Surebet</button>
<button onclick="openSection('puntabanca')">Punta Banca</button>
<button onclick="openSection('freebet')">Freebet</button>
<button onclick="openSection('casino')">Casino Live</button>

</div>


<div id="bonus" class="section">

<div class="box">

<label>Saldo Bonus</label>
<input id="saldo" type="number">

<label>Wagering</label>
<input id="wager" type="number">

<label>Cap</label>
<input id="cap" type="number">

<button onclick="calcola()">Calcola</button>

<div class="result" id="target"></div>
<div class="result" id="spin"></div>

</div>

<button class="back" onclick="goBack()">Menu</button>

</div>



<div id="surebet" class="section">

<div class="box">

<label>Quota 1</label>
<input id="quota1" type="number">

<label>Puntata</label>
<input id="puntata1" type="number">

<label>Quota 2</label>
<input id="quota2" type="number">

<button onclick="calcolaSurebet()">Calcola</button>

<div class="result" id="puntata2"></div>
<div class="result" id="profitto"></div>

</div>

<button class="back" onclick="goBack()">Menu</button>

</div>



<div id="puntabanca" class="section">

<div class="box">

<label>Quota Punta</label>
<input id="quotaPunta" type="number">

<label>Puntata</label>
<input id="puntataPunta" type="number">

<label>Quota Banca</label>
<input id="quotaBanca" type="number">

<button onclick="calcolaPuntaBanca()">Calcola</button>

<div class="result" id="puntataBancaResult"></div>

</div>

<button class="back" onclick="goBack()">Menu</button>

</div>



<div id="freebet" class="section">

<div class="box">

<label>Importo Freebet</label>
<input id="importoFreebet" type="number">

<label>Quota Punta</label>
<input id="quotaFreebetPunta" type="number">

<label>Quota Banca</label>
<input id="quotaFreebetBanca" type="number">

<button onclick="calcolaFreebet()">Calcola</button>

<div class="result" id="profittoFreebetResult"></div>

</div>

<button class="back" onclick="goBack()">Menu</button>

</div>



<div id="casino" class="section">

<div class="box">

<label>Inserisci importo su Player</label>
<input id="playerStake" type="number">

<button onclick="calcolaBaccarat()">Calcola</button>

<div class="result" id="bankerStake"></div>
<div class="result" id="baccaratProfit"></div>

</div>

<button class="back" onclick="goBack()">Menu</button>

</div>

</div>



<script>

function openSection(id){
document.getElementById("menu").style.display="none";
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById(id).style.display="block";
}

function goBack(){
document.querySelectorAll(".section").forEach(s=>s.style.display="none");
document.getElementById("menu").style.display="block";
}

function calcola(){

let saldo=Number(document.getElementById("saldo").value)
let wager=Number(document.getElementById("wager").value)
let cap=Number(document.getElementById("cap").value)

let target=(saldo*wager*0.05)+cap
let spin=saldo/20

document.getElementById("target").innerHTML="Target: "+target.toFixed(2)
document.getElementById("spin").innerHTML="Spin: "+spin.toFixed(2)

}

function calcolaSurebet(){

let q1=Number(document.getElementById("quota1").value)
let s1=Number(document.getElementById("puntata1").value)
let q2=Number(document.getElementById("quota2").value)

let ritorno=q1*s1
let s2=Math.round(ritorno/q2)
let profitto=ritorno-s1-s2

document.getElementById("puntata2").innerHTML="Puntata 2: "+s2
document.getElementById("profitto").innerHTML="Profitto: "+profitto.toFixed(2)

}

function calcolaPuntaBanca(){

let q1=Number(document.getElementById("quotaPunta").value)
let s1=Number(document.getElementById("puntataPunta").value)
let q2=Number(document.getElementById("quotaBanca").value)

let banca=(q1*s1)/q2

document.getElementById("puntataBancaResult").innerHTML="Puntata banca: "+banca.toFixed(2)

}

function calcolaFreebet(){

let free=Number(document.getElementById("importoFreebet").value)
let qP=Number(document.getElementById("quotaFreebetPunta").value)
let qB=Number(document.getElementById("quotaFreebetBanca").value)

let lay=(free*(qP-1))/qB

document.getElementById("profittoFreebetResult").innerHTML="Puntata banca: "+lay.toFixed(2)

}

function calcolaBaccarat(){

const playerOdds=2.00
const bankerOdds=1.95

let playerStake=Number(document.getElementById("playerStake").value)

let ritorno=playerStake*playerOdds
let bankerStake=Math.round(ritorno/bankerOdds)
let profit=ritorno-playerStake-bankerStake

document.getElementById("bankerStake").innerHTML="Metti su Banker: "+bankerStake
document.getElementById("baccaratProfit").innerHTML="Profitto: "+profit.toFixed(2)

}

</script>

</body>
</html>
