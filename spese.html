<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Spese - TrackerGatto</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070809;--panel:#111315;--line:#292d31;--txt:#f7f7f7;--muted:#9ca2a8;--gold:#f4bf28;--green:#3ddc84;--red:#ff6b6b;--blue:#65b7ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#241b05 0,transparent 26%),linear-gradient(180deg,#050607,#0d0f11);color:var(--txt);font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:20px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:20px}.top h1{margin:0;font-size:30px}.top p{margin:5px 0 0;color:var(--muted)}.btn{border:1px solid #3b4045;background:#171a1d;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.btn.gold{border:0;background:linear-gradient(180deg,#f6ca38,#d59b00);color:#211700}.summary{display:grid;grid-template-columns:repeat(7,1fr);gap:12px;margin-bottom:18px}.card{background:linear-gradient(180deg,#15181b,#0f1113);border:1px solid var(--line);border-radius:16px;padding:16px}.card small{color:var(--muted);display:block;margin-bottom:7px}.card strong{font-size:24px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}.toolbar input,.toolbar select,.modal input,.modal select,.modal textarea{background:#090b0d;color:#fff;border:1px solid #34393e;border-radius:10px;padding:11px;outline:none}.toolbar input[type=month]{min-width:170px}.list{display:grid;gap:10px}.row{display:grid;grid-template-columns:1.4fr .8fr .7fr .8fr .8fr auto;gap:10px;align-items:center;background:#111315;border:1px solid var(--line);border-radius:14px;padding:13px}.name b{display:block}.name small,.muted{color:var(--muted)}.pill{display:inline-block;padding:5px 9px;border-radius:999px;font-size:12px;font-weight:900;border:1px solid #444}.paid{color:#8dffc0;border-color:#23643e;background:#0e2618}.due{color:#ffd66d;border-color:#695410;background:#2a2208}.late{color:#ff9f9f;border-color:#713333;background:#2d1010}.receive{color:#9ed0ff;border-color:#315f88;background:#0b2032}.received{color:#9fffc9;border-color:#28784b;background:#0b2819}.actions{display:flex;gap:6px;flex-wrap:wrap}.actions button{border:1px solid #353a3f;background:#171a1d;color:#fff;border-radius:8px;padding:7px 9px;cursor:pointer}.empty{text-align:center;color:var(--muted);padding:35px;border:1px dashed #333;border-radius:14px}.modalBg{position:fixed;inset:0;background:#000a;display:none;place-items:center;padding:16px}.modalBg.show{display:grid}.modal{width:min(520px,100%);background:#111315;border:1px solid #353a3f;border-radius:18px;padding:20px}.modal h2{margin-top:0}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{margin-bottom:11px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#ddd}.field input,.field select,.field textarea{width:100%}.field textarea{min-height:80px;resize:vertical}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:900px){.summary{grid-template-columns:repeat(2,1fr)}.row{grid-template-columns:1fr 1fr}.actions{grid-column:1/-1}}@media(max-width:560px){.wrap{padding:12px}.summary{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr}.actions{grid-column:auto}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div class="wrap"><div class="top"><div><h1>💸 Spese</h1><p>Registra spese, pagamenti e somme da ricevere.</p></div><div><button class="btn" onclick="location.href='/'">← Dashboard</button> <button class="btn" id="workBtn">💼 Lavoro</button> <button class="btn gold" id="newBtn">+ Nuova voce</button></div></div><div class="summary"><div class="card"><small>Totale spese mese</small><strong id="totMonth">€ 0,00</strong></div><div class="card"><small>Pagato</small><strong id="totPaid">€ 0,00</strong></div><div class="card"><small>Stipendio ricevuto</small><strong id="totSalary">€ 0,00</strong></div><div class="card"><small>Da pagare</small><strong id="totDue">€ 0,00</strong></div><div class="card"><small>Da ricevere</small><strong id="totReceive">€ 0,00</strong></div><div class="card"><small>Differenza ricevuto - pagato</small><strong id="totDifference">€ 0,00</strong></div><div class="card"><small>Extra</small><strong id="totExtra">€ 0,00</strong></div></div><div class="toolbar"><input type="month" id="month"><select id="catFilter"><option value="">Tutte le categorie</option><option>Mutuo</option><option>Luce</option><option>Gas</option><option>Benzina</option><option>Sigarette</option><option>Spesa</option><option>Lavoro</option><option>Extra</option></select><select id="statusFilter"><option value="">Tutti gli stati</option><option value="due">Da pagare</option><option value="paid">Pagate</option><option value="receive">Da ricevere</option><option value="received">Ricevute</option></select></div><div id="list" class="list"></div></div><div id="modalBg" class="modalBg"><div class="modal"><h2 id="modalTitle">Nuova voce</h2><div class="field"><label>Nome</label><input id="nome" placeholder="Es. Bolletta luce agosto"></div><div class="grid2"><div class="field"><label>Categoria</label><select id="categoria"><option>Mutuo</option><option>Luce</option><option>Gas</option><option>Benzina</option><option>Sigarette</option><option>Spesa</option><option>Lavoro</option><option selected>Extra</option></select></div><div class="field"><label>Importo €</label><input id="importo" type="number" min="0" step="0.01"></div></div><div class="grid2"><div class="field"><label>Scadenza</label><input id="scadenza" type="date"></div><div class="field"><label>Stato</label><select id="stato"><option value="due">Da pagare</option><option value="paid">Pagata</option><option value="receive">Da ricevere</option><option value="received">Ricevuta</option></select></div></div><div class="field"><label>Note</label><textarea id="note" placeholder="Facoltative"></textarea></div><div class="modalActions"><button class="btn" id="cancelBtn">Annulla</button><button class="btn gold" id="saveBtn">Salva</button></div></div></div><script>const SB=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');const $=id=>document.getElementById(id);let user=null,rows=[],editing=null;const eur=v=>new Intl.NumberFormat('it-IT',{style:'currency',currency:'EUR'}).format(Number(v||0));const today=()=>new Date().toISOString().slice(0,10);function currentMonth(){return new Date().toISOString().slice(0,7)}function stateOf(r){const note=String(r.note||'');if(note.startsWith('[STATO:RICEVERE]'))return'receive';if(note.startsWith('[STATO:RICEVUTO]'))return'received';return r.pagata?'paid':'due'}function isWork(r){return /\[LAVORO\]/.test(String(r?.note||''))}function cleanNote(note){return String(note||'').replace(/^\[STATO:(RICEVERE|RICEVUTO)\]\s*/,'').replace(/^\[LAVORO\]\s*/,'')}function storedNote(state,note){const base=String(note||'').trim();if(state==='receive')return'[STATO:RICEVERE] '+base;if(state==='received')return'[STATO:RICEVUTO] '+base;return base||null}function openModal(r=null){editing=r?.id||null;$('modalTitle').textContent=r?'Modifica voce':'Nuova voce';$('nome').value=r?.nome||'';$('categoria').value=r?(isWork(r)?'Lavoro':r.categoria):'Extra';$('importo').value=r?.importo??'';$('scadenza').value=r?.scadenza||today();$('stato').value=r?stateOf(r):'due';$('note').value=cleanNote(r?.note||'');$('modalBg').classList.add('show')}function closeModal(){$('modalBg').classList.remove('show');editing=null}function filtered(){const m=$('month').value,c=$('catFilter').value,s=$('statusFilter').value;return rows.filter(r=>(!m||String(r.scadenza).startsWith(m))&&(!c||(c==='Lavoro'?isWork(r):(c==='Extra'?r.categoria==='Extra'&&!isWork(r):r.categoria===c)))&&(!s||stateOf(r)===s))}function render(){const monthRows=rows.filter(r=>String(r.scadenza).startsWith($('month').value)),expenses=monthRows.filter(r=>!['receive','received'].includes(stateOf(r)));$('totMonth').textContent=eur(expenses.reduce((a,r)=>a+n(r.importo),0));$('totPaid').textContent=eur(monthRows.filter(r=>stateOf(r)==='paid').reduce((a,r)=>a+n(r.importo),0));$('totSalary').textContent=eur(monthRows.filter(r=>isWork(r)&&stateOf(r)==='received').reduce((a,r)=>a+n(r.importo),0));$('totDue').textContent=eur(monthRows.filter(r=>stateOf(r)==='due').reduce((a,r)=>a+n(r.importo),0));$('totReceive').textContent=eur(monthRows.filter(r=>stateOf(r)==='receive').reduce((a,r)=>a+n(r.importo),0));const paidTotal=monthRows.filter(r=>stateOf(r)==='paid').reduce((a,r)=>a+n(r.importo),0),receivedTotal=monthRows.filter(r=>stateOf(r)==='received').reduce((a,r)=>a+n(r.importo),0),difference=receivedTotal-paidTotal;const diffEl=$('totDifference');diffEl.textContent=eur(difference);diffEl.style.color=difference>=0?'var(--green)':'var(--red)';$('totExtra').textContent=eur(expenses.filter(r=>r.categoria==='Extra').reduce((a,r)=>a+n(r.importo),0));const data=filtered().sort((a,b)=>String(a.scadenza).localeCompare(String(b.scadenza)));$('list').innerHTML=data.length?data.map(r=>{let st=stateOf(r),late=st==='due'&&r.scadenza<today(),cls=st==='paid'?'paid':st==='receive'?'receive':st==='received'?'received':late?'late':'due',label=st==='paid'?'✓ Pagata':st==='receive'?'↙ Da ricevere':st==='received'?'✓ Ricevuta':late?'⚠ Scaduta':'Da pagare',action=st==='receive'?`<button onclick="setState('${r.id}','received')">Segna ricevuta</button>`:st==='received'?`<button onclick="setState('${r.id}','receive')">Riapri</button>`:st==='paid'?`<button onclick="setState('${r.id}','due')">Riapri</button>`:`<button onclick="setState('${r.id}','paid')">Segna pagata</button>`;return`<div class="row"><div class="name"><b>${esc(r.nome)}</b><small>${esc(isWork(r)?'Lavoro':r.categoria)}${cleanNote(r.note)?` · ${esc(cleanNote(r.note))}`:''}</small></div><div><b>${eur(r.importo)}</b></div><div class="muted">${fmtDate(r.scadenza)}</div><div><span class="pill ${cls}">${label}</span></div><div class="muted">${(st==='paid'||st==='received')&&r.data_pagamento?(st==='received'?'Ricevuta ':'Pagata ')+fmtDate(r.data_pagamento):''}</div><div class="actions">${action}<button onclick="editRow('${r.id}')">Modifica</button><button onclick="delRow('${r.id}')">Elimina</button></div></div>`}).join(''):'<div class="empty">Nessuna voce per questo filtro.</div>'}function n(v){const x=Number(v);return Number.isFinite(x)?x:0}function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[m]))}function fmtDate(d){if(!d)return'';const [y,m,day]=d.split('-');return`${day}/${m}/${y}`}async function load(){const {data,error}=await SB.from('spese').select('*').order('scadenza',{ascending:false});if(error){$('list').innerHTML=`<div class="empty">Errore: ${esc(error.message)}</div>`;return}rows=data||[];render()}async function save(){const nome=$('nome').value.trim(),importo=n($('importo').value),scadenza=$('scadenza').value,state=$('stato').value;if(!nome||!scadenza||importo<0){alert('Compila nome, importo e scadenza.');return}const done=state==='paid'||state==='received',work=$('categoria').value==='Lavoro',baseNote=(work?'[LAVORO] ':'')+$('note').value,payload={user_id:user.id,nome,categoria:work?'Extra':$('categoria').value,importo,scadenza,pagata:done,data_pagamento:done?today():null,note:storedNote(state,baseNote)};let error;if(editing)({error}=await SB.from('spese').update(payload).eq('id',editing));else({error}=await SB.from('spese').insert(payload));if(error){alert(error.message);return}closeModal();await load()}async function setState(id,state){const r=rows.find(x=>x.id===id);if(!r)return;const done=state==='paid'||state==='received',note=storedNote(state,(isWork(r)?'[LAVORO] ':'')+cleanNote(r.note));const {error}=await SB.from('spese').update({pagata:done,data_pagamento:done?today():null,note}).eq('id',id);if(error)return alert(error.message);await load()}function editRow(id){openModal(rows.find(r=>r.id===id))}async function delRow(id){if(!confirm('Eliminare questa voce?'))return;const {error}=await SB.from('spese').delete().eq('id',id);if(error)return alert(error.message);await load()}async function boot(){const {data}=await SB.auth.getSession();if(!data?.session){location.href='/';return}user=data.session.user;$('month').value=currentMonth();await load()}$('workBtn').onclick=()=>{openModal();$('nome').value='Lavoro';$('categoria').value='Lavoro';$('stato').value='received';$('scadenza').value=today()};$('newBtn').onclick=()=>openModal();$('cancelBtn').onclick=closeModal;$('saveBtn').onclick=save;$('modalBg').onclick=e=>{if(e.target===$('modalBg'))closeModal()};['month','catFilter','statusFilter'].forEach(id=>$(id).onchange=render);boot();</script></body></html>
