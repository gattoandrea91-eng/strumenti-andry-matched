<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Servizi</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body{
      margin:0;
      font-family:Arial, Helvetica, sans-serif;
      background:#0b1220;
      color:white;
    }
    .wrap{
      max-width:900px;
      margin:auto;
      padding:24px 16px 60px;
    }
    .box{
      background:#111827;
      border:1px solid #334155;
      border-radius:16px;
      padding:20px;
      margin-top:16px;
    }
    input, select, button{
      width:100%;
      padding:12px;
      border-radius:10px;
      font-size:16px;
      margin-top:10px;
      box-sizing:border-box;
    }
    input, select{
      background:#020617;
      color:white;
      border:1px solid #334155;
    }
    button{
      border:none;
      cursor:pointer;
      font-weight:bold;
    }
    .green{
      background:#22c55e;
      color:#052e16;
    }
    .gray{
      background:#334155;
      color:white;
    }
    .red{
      background:#b91c1c;
      color:white;
    }
    .hidden{ display:none; }
    .msg{
      margin-top:10px;
      color:#cbd5e1;
      min-height:20px;
    }
    .service{
      background:#0f172a;
      border:1px solid #334155;
      border-radius:12px;
      padding:14px;
      margin-top:10px;
    }
    .row{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    .row button{
      width:auto;
      min-width:120px;
      margin-top:0;
    }
    table{
      width:100%;
      border-collapse:collapse;
      margin-top:14px;
    }
    th, td{
      border-bottom:1px solid #334155;
      padding:10px 8px;
      text-align:left;
      font-size:14px;
    }
    .pos{ color:#4ade80; font-weight:bold; }
    .neg{ color:#f87171; font-weight:bold; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Servizi</h1>

    <div id="authBox" class="box">
      <h2 style="margin-top:0;">Login</h2>
      <input id="email" type="email" placeholder="Email">
      <input id="password" type="password" placeholder="Password">
      <button class="green" id="loginBtn">Login</button>
      <div id="authMsg" class="msg">—</div>
    </div>

    <div id="appBox" class="hidden">
      <div class="box">
        <h2 style="margin-top:0;">Area Servizi</h2>
        <div id="userMail" class="msg"></div>
        <div class="row">
          <button class="gray" onclick="window.location.href='index.html'">← Torna a index</button>
          <button class="gray" id="logoutBtn">Logout</button>
        </div>
      </div>

      <div class="box">
        <h3 style="margin-top:0;">Totale Servizi</h3>
        <div id="totalBox" style="font-size:28px;font-weight:bold;">€ 0,00</div>
      </div>

      <div class="box">
        <h3 style="margin-top:0;">Crea servizio</h3>
        <input id="serviceName" placeholder="Nome servizio">
        <button class="green" id="createServiceBtn">Crea servizio</button>
        <div id="serviceMsg" class="msg">—</div>
      </div>

      <div class="box">
        <h3 style="margin-top:0;">I tuoi servizi</h3>
        <div id="servicesList">Nessun servizio</div>
      </div>

      <div id="panel" class="box hidden">
        <h3 id="panelTitle" style="margin-top:0;">Servizio</h3>
        <div id="panelTotal" style="font-size:24px;font-weight:bold;">€ 0,00</div>

        <input id="stake" type="number" step="0.01" placeholder="Stake">
        <input id="quota" type="number" step="0.01" placeholder="Quota">

        <select id="result">
          <option value="win">Win</option>
          <option value="loss">Loss</option>
        </select>

        <input id="note" type="text" placeholder="Nota facoltativa">

        <div class="row">
          <button class="green" id="addEntryBtn">Aggiungi puntata</button>
          <button class="gray" id="closePanelBtn">Chiudi</button>
        </div>

        <div id="entryMsg" class="msg">—</div>

        <table>
          <thead>
            <tr>
              <th>Data</th>
              <th>Stake</th>
              <th>Quota</th>
              <th>Esito</th>
              <th>Profitto</th>
              <th>Nota</th>
              <th>Azione</th>
            </tr>
          </thead>
          <tbody id="entriesBody">
            <tr><td colspan="7">Nessuna puntata</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://aihwrkqfzhwedqdbxbxh.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd";
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentServiceId = null;
    let currentServiceName = "";

    function euro(v){
      return "€ " + Number(v || 0).toLocaleString("it-IT", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      });
    }

    function setAuthMsg(text){ document.getElementById("authMsg").innerText = text; }
    function setServiceMsg(text){ document.getElementById("serviceMsg").innerText = text; }
    function setEntryMsg(text){ document.getElementById("entryMsg").innerText = text; }

    function showAuth(){
      document.getElementById("authBox").classList.remove("hidden");
      document.getElementById("appBox").classList.add("hidden");
    }

    function showApp(){
      document.getElementById("authBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      document.getElementById("userMail").innerText = currentUser?.email || "";
    }

    async function login(){
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if(!email || !password){
        setAuthMsg("Inserisci email e password.");
        return;
      }

      setAuthMsg("Login in corso...");

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if(error){
        setAuthMsg(error.message);
        return;
      }

      currentUser = data.user;
      showApp();
      setAuthMsg("Login effettuato.");
      await loadServices();
      await loadTotal();
    }

    async function logout(){
      await supabaseClient.auth.signOut();
      currentUser = null;
      currentServiceId = null;
      currentServiceName = "";
      document.getElementById("panel").classList.add("hidden");
      showAuth();
      setAuthMsg("Logout effettuato.");
    }

    async function createService(){
      if(!currentUser){
        setServiceMsg("Devi fare login.");
        return;
      }

      const name = document.getElementById("serviceName").value.trim();
      if(!name){
        setServiceMsg("Inserisci il nome del servizio.");
        return;
      }

      setServiceMsg("Creazione in corso...");

      const { error } = await supabaseClient.from("services").insert([{
        user_id: currentUser.id,
        name
      }]);

      if(error){
        setServiceMsg(error.message);
        return;
      }

      document.getElementById("serviceName").value = "";
      setServiceMsg("Servizio creato.");
      await loadServices();
      await loadTotal();
    }

    async function loadServices(){
      if(!currentUser) return;

      const { data, error } = await supabaseClient
        .from("services")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", { ascending: false });

      const list = document.getElementById("servicesList");

      if(error){
        list.innerHTML = error.message;
        return;
      }

      const services = data || [];

      if(!services.length){
        list.innerHTML = "Nessun servizio";
        return;
      }

      const html = await Promise.all(
        services.map(async (s) => {
          const { data: entries } = await supabaseClient
            .from("service_entries")
            .select("profit")
            .eq("service_id", s.id);

          const total = (entries || []).reduce((sum, e) => sum + Number(e.profit || 0), 0);

          return `
            <div class="service">
              <div><b>${s.name}</b></div>
              <div class="${total >= 0 ? 'pos' : 'neg'}" style="margin-top:6px;">${euro(total)}</div>
              <div class="row">
                <button class="gray" onclick="openService('${s.id}', ${JSON.stringify(s.name).replace(/"/g, '&quot;')})">Apri</button>
                <button class="red" onclick="deleteService('${s.id}')">Elimina</button>
              </div>
            </div>
          `;
        })
      );

      list.innerHTML = html.join("");
    }

    async function deleteService(id){
      const yes = confirm("Vuoi eliminare questo servizio e tutte le sue puntate?");
      if(!yes) return;

      const { error } = await supabaseClient
        .from("services")
        .delete()
        .eq("id", id);

      if(error){
        alert(error.message);
        return;
      }

      if(currentServiceId === id){
        closePanel();
      }

      await loadServices();
      await loadTotal();
    }

    async function openService(id, name){
      currentServiceId = id;
      currentServiceName = name;
      document.getElementById("panel").classList.remove("hidden");
      document.getElementById("panelTitle").innerText = name;
      setEntryMsg("—");
      await loadEntries();
    }

    function closePanel(){
      currentServiceId = null;
      currentServiceName = "";
      document.getElementById("panel").classList.add("hidden");
    }

    async function addEntry(){
      if(!currentServiceId){
        setEntryMsg("Apri prima un servizio.");
        return;
      }

      const stake = Number(document.getElementById("stake").value || 0);
      const quota = Number(document.getElementById("quota").value || 0);
      const result = document.getElementById("result").value;
      const note = document.getElementById("note").value.trim();

      if(stake <= 0){
        setEntryMsg("Inserisci uno stake valido.");
        return;
      }

      if(result === "win" && quota <= 1){
        setEntryMsg("Per Win inserisci una quota superiore a 1.");
        return;
      }

      const profit = result === "win" ? (stake * quota - stake) : -stake;

      setEntryMsg("Salvataggio in corso...");

      const { error } = await supabaseClient.from("service_entries").insert([{
        user_id: currentUser.id,
        service_id: currentServiceId,
        entry_date: new Date().toISOString().slice(0,10),
        stake,
        quota,
        result,
        profit,
        note
      }]);

      if(error){
        setEntryMsg(error.message);
        return;
      }

      document.getElementById("stake").value = "";
      document.getElementById("quota").value = "";
      document.getElementById("note").value = "";
      document.getElementById("result").value = "win";

      setEntryMsg("Puntata salvata.");
      await loadEntries();
      await loadServices();
      await loadTotal();
    }

    async function loadEntries(){
      const { data, error } = await supabaseClient
        .from("service_entries")
        .select("*")
        .eq("service_id", currentServiceId)
        .order("entry_date", { ascending: false })
        .order("created_at", { ascending: false });

      const tbody = document.getElementById("entriesBody");

      if(error){
        tbody.innerHTML = `<tr><td colspan="7">${error.message}</td></tr>`;
        return;
      }

      const rows = data || [];
      const total = rows.reduce((sum, e) => sum + Number(e.profit || 0), 0);

      const totalEl = document.getElementById("panelTotal");
      totalEl.innerText = euro(total);
      totalEl.className = total >= 0 ? "pos" : "neg";

      if(!rows.length){
        tbody.innerHTML = `<tr><td colspan="7">Nessuna puntata</td></tr>`;
        return;
      }

      tbody.innerHTML = rows.map(e => `
        <tr>
          <td>${e.entry_date || "—"}</td>
          <td>${euro(e.stake || 0)}</td>
          <td>${Number(e.quota || 0).toLocaleString("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</td>
          <td>${(e.result || "").toUpperCase()}</td>
          <td class="${Number(e.profit || 0) >= 0 ? 'pos' : 'neg'}">${euro(e.profit || 0)}</td>
          <td>${e.note || "—"}</td>
          <td><button class="red" onclick="deleteEntry('${e.id}')">Elimina</button></td>
        </tr>
      `).join("");
    }

    async function deleteEntry(id){
      const yes = confirm("Vuoi eliminare questa puntata?");
      if(!yes) return;

      const { error } = await supabaseClient
        .from("service_entries")
        .delete()
        .eq("id", id);

      if(error){
        alert(error.message);
        return;
      }

      await loadEntries();
      await loadServices();
      await loadTotal();
    }

    async function loadTotal(){
      if(!currentUser) return;

      const { data, error } = await supabaseClient
        .from("service_entries")
        .select("profit")
        .eq("user_id", currentUser.id);

      if(error){
        document.getElementById("totalBox").innerText = "Errore";
        return;
      }

      const total = (data || []).reduce((sum, e) => sum + Number(e.profit || 0), 0);
      const el = document.getElementById("totalBox");
      el.innerText = euro(total);
      el.className = total >= 0 ? "pos" : "neg";
    }

    async function boot(){
      try{
        const { data, error } = await supabaseClient.auth.getUser();

        if(error || !data?.user){
          showAuth();
          setAuthMsg("Fai login per usare i Servizi.");
          return;
        }

        currentUser = data.user;
        showApp();
        await loadServices();
        await loadTotal();
      }catch(err){
        showAuth();
        setAuthMsg("Errore iniziale pagina.");
        console.error(err);
      }
    }

    document.getElementById("loginBtn").addEventListener("click", login);
    document.getElementById("logoutBtn").addEventListener("click", logout);
    document.getElementById("createServiceBtn").addEventListener("click", createService);
    document.getElementById("addEntryBtn").addEventListener("click", addEntry);
    document.getElementById("closePanelBtn").addEventListener("click", closePanel);

    boot();
  </script>
</body>
</html>
