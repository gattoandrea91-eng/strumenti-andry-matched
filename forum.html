<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forum TrackerGatto</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070809;--panel:#111315;--panel2:#171a1d;--line:#292d31;--gold:#f4bf28;--txt:#f7f7f7;--muted:#9da3aa;--red:#ff6b6b;--green:#44d67a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#241b05 0,transparent 28%),#070809;color:var(--txt);font-family:Inter,Arial,sans-serif}.wrap{max-width:1180px;margin:auto;padding:22px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#0b0d0f;border-radius:18px;padding:16px 20px}.brand{display:flex;align-items:center;gap:12px}.cat{width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:25px}.brand b{font-size:24px}.brand b span{color:var(--gold)}.topRight{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{border:1px solid #5a4610;background:#2b220a;color:#ffd85a;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:900}.btn{border:1px solid #3b4045;background:#171a1d;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.gold{border:0;background:linear-gradient(180deg,#f6ca38,#d59b00);color:#211700}.danger{border-color:#6b3030;color:#ff9b9b}.hero{padding:28px 2px 16px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}.search,input,textarea{background:#0c0e10;border:1px solid #30353a;color:#fff;padding:12px;border-radius:10px;outline:none}.search{width:min(440px,100%)}textarea{width:100%;min-height:130px;resize:vertical}.group,.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin-top:14px}.groupTitle{background:#252b31;padding:14px 16px;border-bottom:3px solid var(--gold);font-size:17px;font-weight:900}.row{display:grid;grid-template-columns:52px minmax(220px,1fr) 100px 100px minmax(180px,300px);align-items:center;min-height:78px;padding:10px 16px;border-bottom:1px solid #25292d;gap:8px;cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:#15181b}.ico{font-size:26px;text-align:center}.name{font-weight:900;font-size:16px}.desc,.muted{font-size:12px;color:var(--muted);margin-top:4px}.stat{text-align:center;font-size:13px}.stat small{display:block;color:var(--muted);margin-bottom:4px}.last{font-size:12px}.last b{display:block;color:#f4cc55;margin-bottom:4px}.crumb{color:#e8c85e;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:10px}.headLine{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.threadRow,.guideRow{padding:15px 17px;border-bottom:1px solid #25292d;cursor:pointer}.threadRow:hover,.guideRow:hover{background:#15181b}.threadTitle{font-size:16px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:5px}.guideRow{background:linear-gradient(90deg,#171204,#111315);border-left:3px solid var(--gold)}.guideRow .threadTitle{color:#ffd85a}.post{padding:17px;border-bottom:1px solid #25292d}.postHead{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px}.author{color:#f4cc55;font-weight:900}.body{white-space:pre-wrap;line-height:1.55;font-size:14px}.actions{display:flex;gap:7px;margin-top:10px}.mini{padding:6px 9px;border-radius:8px;border:1px solid #34383d;background:#171a1d;color:#ddd;cursor:pointer;font-size:11px}.composer{padding:16px}.notice,.empty{padding:20px;text-align:center;color:#888}.modalBg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(610px,100%);background:#111315;border:1px solid #353a3f;border-radius:17px;padding:20px}.modal input{width:100%;margin-bottom:10px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:760px){.row{grid-template-columns:42px 1fr}.stat,.last{display:none}.top{flex-direction:column;align-items:flex-start}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="cat">🐱</div><div><b>Tracker<span>Gatto</span></b><div style="font-size:10px;color:#f4bf28;font-weight:900">FORUM COMMUNITY</div></div></div><div class="topRight"><span id="modeBadge" class="badge">● CARICAMENTO</span><button class="btn" onclick="location.href='home-odds.html'">← Strumenti</button></div></header><div id="app"></div></main><div id="modalRoot"></div><script>const SB=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');const cats=[['calendar','🗓','Bonus - Calendario','Calendario promozioni e scadenze.','Bonus'],['welcome','🎁','Bonus - Benvenuto','Offerte di benvenuto e nuovi bookmaker.','Bonus'],['recurring','🔄','Bonus - Ricorrenti','Promozioni periodiche e ricorrenti.','Bonus'],['personal','👤','Bonus - Personali','Promozioni riservate e personali.','Bonus'],['archive','📁','Bonus - Archivio','Bonus conclusi e discussioni archiviate.','Bonus'],['strategy','📊','Strategie Matched Betting','Qualificanti, freebet, coperture e metodi.','Risorse'],['odds','⚽','Scommesse e Quote','Quote, mercati e analisi delle partite.','Risorse'],['general','💬','Discussioni Generali','Community, domande e confronto tra utenti.','Risorse']];let state={cat:null,thread:null,user:null,remote:false,threads:[],posts:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});async function init(){const {data}=await SB.auth.getSession();state.user=data?.session?.user||null;try{await refreshRemote();state.remote=true;$('#modeBadge').textContent='● FORUM ONLINE'}catch{state.remote=false;$('#modeBadge').textContent='● MODALITÀ LOCALE';state.threads=[];state.posts=[]}renderHome()}async function refreshRemote(){const [t,p]=await Promise.all([SB.from('forum_threads').select('*').order('created_at',{ascending:false}),SB.from('forum_posts').select('*').order('created_at',{ascending:true})]);if(t.error)throw t.error;if(p.error)throw p.error;state.threads=t.data||[];state.posts=p.data||[]}function counts(cat){const ts=state.threads.filter(x=>x.category===cat),ids=new Set(ts.map(x=>String(x.id)));return[ts.length,ts.length+state.posts.filter(x=>ids.has(String(x.thread_id))).length]}function catRow(c){const [n,m]=counts(c[0]);return`<div class="row" onclick="openCategory('${c[0]}')"><div class="ico">${c[1]}</div><div><div class="name">${c[2]}</div><div class="desc">${c[3]}</div></div><div class="stat"><small>Discussioni</small>${n}</div><div class="stat"><small>Messaggi</small>${m}</div><div class="last">${c[0]==='recurring'?'<b>🎡 PokerStars — Ruota giornaliera</b>Guida TrackerGatto disponibile':'Apri la sezione'}</div></div>`}function renderHome(){const b=cats.filter(x=>x[4]==='Bonus'),r=cats.filter(x=>x[4]==='Risorse');$('#app').innerHTML=`<section class="hero"><h1>Forum - TrackerGatto Club</h1><p>Bonus, strategie, matched betting e discussioni della community.</p></section><section class="group"><div class="groupTitle">🎁 Bonus</div>${b.map(catRow).join('')}</section><section class="group"><div class="groupTitle">📚 Risorse</div>${r.map(catRow).join('')}</section>`}async function openCategory(id){state.cat=id;if(state.remote)await refreshRemote();const c=cats.find(x=>x[0]===id),list=state.threads.filter(x=>x.category===id);const guide=id==='recurring'?`<div class="guideRow" onclick="location.href='bonus-pokerstars-ruota.html'"><div class="threadTitle">🎡 PokerStars — Ruota giornaliera <span class="badge">GUIDA</span></div><div class="meta">Ricorrente • Giornaliera • Profitto indicativo 0–90 € • Apri la scheda completa →</div></div>`:'';$('#app').innerHTML=`<section class="hero"><div class="crumb" onclick="renderHome()">← Forum</div><div class="headLine"><div><h1>${c[1]} ${c[2]}</h1><p>${c[3]}</p></div><button class="btn gold" onclick="newThreadModal()">＋ Nuova discussione</button></div></section><section class="card">${guide}${list.length?list.map(threadRow).join(''):(guide?'':'<div class="empty">Nessuna discussione. Creane una!</div>')}</section>`}function threadRow(t){const replies=state.posts.filter(p=>String(p.thread_id)===String(t.id)).length;return`<div class="threadRow" onclick="openThread('${t.id}')"><div class="threadTitle">💬 ${esc(t.title)}</div><div class="meta">${esc(t.author_email||'Utente')} • ${fmt(t.created_at)} • ${replies} risposte</div></div>`}async function openThread(id){if(state.remote)await refreshRemote();state.thread=state.threads.find(x=>String(x.id)===String(id));renderThread()}function own(x){return !!state.user&&x.author_id===state.user.id}function renderThread(){const t=state.thread,ps=state.posts.filter(p=>String(p.thread_id)===String(t.id));$('#app').innerHTML=`<section class="hero"><div class="crumb" onclick="openCategory('${t.category}')">← Categoria</div><h1>${esc(t.title)}</h1><p>${esc(t.author_email||'Utente')} • ${fmt(t.created_at)}</p></section><section class="card"><div class="post"><div class="postHead"><span class="author">${esc(t.author_email||'Utente')}</span></div><div class="body">${esc(t.body)}</div>${own(t)?`<div class="actions"><button class="mini danger" onclick="deleteItem('thread','${t.id}')">Elimina</button></div>`:''}</div>${ps.map(p=>`<div class="post"><div class="postHead"><span class="author">${esc(p.author_email||'Utente')}</span><span class="muted">${fmt(p.created_at)}</span></div><div class="body">${esc(p.body)}</div></div>`).join('')}<div class="composer"><textarea id="replyBody" placeholder="Scrivi una risposta..."></textarea><br><br><button class="btn gold" onclick="addReply()">Pubblica risposta</button></div></section>`}function newThreadModal(){$('#modalRoot').innerHTML=`<div class="modalBg"><div class="modal"><h3>Nuova discussione</h3><input id="newTitle" placeholder="Titolo"><textarea id="newBody" placeholder="Messaggio"></textarea><div class="modalActions"><button class="btn" onclick="$('#modalRoot').innerHTML=''">Annulla</button><button class="btn gold" onclick="createThread()">Pubblica</button></div></div></div>`}async function createThread(){if(!state.user)return alert('Devi essere autenticato.');const title=$('#newTitle').value.trim(),body=$('#newBody').value.trim();if(!title||!body)return;const {error}=await SB.from('forum_threads').insert({category:state.cat,title,body,author_id:state.user.id,author_email:state.user.email});if(error)return alert(error.message);$('#modalRoot').innerHTML='';await openCategory(state.cat)}async function addReply(){if(!state.user)return alert('Devi essere autenticato.');const body=$('#replyBody').value.trim();if(!body)return;const {error}=await SB.from('forum_posts').insert({thread_id:state.thread.id,body,author_id:state.user.id,author_email:state.user.email});if(error)return alert(error.message);await openThread(state.thread.id)}async function deleteItem(type,id){if(!confirm('Eliminare la discussione?'))return;const {error}=await SB.from('forum_threads').delete().eq('id',id);if(error)return alert(error.message);openCategory(state.cat)}init();</script></body></html>
