<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Forum TrackerGatto</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#070809;--panel:#111315;--panel2:#171a1d;--line:#292d31;--gold:#f4bf28;--txt:#f7f7f7;--muted:#9da3aa;--red:#ff6b6b;--green:#44d67a}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0,#241b05 0,transparent 28%),#070809;color:var(--txt);font-family:Inter,Arial,sans-serif}.hidden{display:none!important}.wrap{max-width:1180px;margin:auto;padding:22px 18px 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid var(--line);background:#0b0d0f;border-radius:18px;padding:16px 20px}.brand{display:flex;align-items:center;gap:12px}.cat{width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:25px}.brand b{font-size:24px}.brand b span{color:var(--gold)}.topRight{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.badge{border:1px solid #5a4610;background:#2b220a;color:#ffd85a;padding:9px 12px;border-radius:999px;font-size:11px;font-weight:900}.btn{border:1px solid #3b4045;background:#171a1d;color:#fff;padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}.gold{border:0;background:linear-gradient(180deg,#f6ca38,#d59b00);color:#211700}.danger{border-color:#6b3030;color:#ff9b9b}.hero{padding:28px 2px 16px}.hero h1{margin:0 0 7px;font-size:32px}.hero p{margin:0;color:var(--muted)}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:14px 0;flex-wrap:wrap}.search,input,textarea{background:#0c0e10;border:1px solid #30353a;color:#fff;padding:12px;border-radius:10px;outline:none}.search{width:min(440px,100%)}textarea{width:100%;min-height:130px;resize:vertical}.group,.card{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel);margin-top:14px;box-shadow:0 15px 40px #0005}.groupTitle{background:#252b31;padding:14px 16px;border-bottom:3px solid var(--gold);font-size:17px;font-weight:900}.row{display:grid;grid-template-columns:52px minmax(220px,1fr) 100px 100px minmax(180px,300px);align-items:center;min-height:78px;padding:10px 16px;border-bottom:1px solid #25292d;gap:8px;cursor:pointer}.row:last-child{border-bottom:0}.row:hover{background:#15181b}.ico{font-size:26px;text-align:center}.name{font-weight:900;font-size:16px}.desc,.muted{font-size:12px;color:var(--muted);margin-top:4px}.stat{text-align:center;font-size:13px}.stat small{display:block;color:var(--muted);margin-bottom:4px}.last{font-size:12px}.last b{display:block;color:#f4cc55;margin-bottom:4px}.crumb{color:#e8c85e;font-size:13px;font-weight:800;cursor:pointer;margin-bottom:10px}.headLine{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.headLine h2{margin:0}.threadRow{padding:15px 17px;border-bottom:1px solid #25292d;cursor:pointer}.threadRow:last-child{border-bottom:0}.threadRow:hover{background:#15181b}.threadTitle{font-size:16px;font-weight:900}.meta{font-size:11px;color:var(--muted);margin-top:5px}.post{padding:17px;border-bottom:1px solid #25292d}.post:last-child{border-bottom:0}.postHead{display:flex;justify-content:space-between;gap:10px;margin-bottom:10px;flex-wrap:wrap}.author{color:#f4cc55;font-weight:900}.body{white-space:pre-wrap;line-height:1.55;font-size:14px}.actions{display:flex;gap:7px;margin-top:10px}.mini{padding:6px 9px;border-radius:8px;border:1px solid #34383d;background:#171a1d;color:#ddd;cursor:pointer;font-size:11px}.composer{padding:16px}.composer input{width:100%;margin-bottom:10px}.notice{padding:12px 14px;border:1px dashed #5b4a18;background:#171407;color:#e5ca72;border-radius:11px;font-size:12px;margin-top:14px}.empty{padding:28px;text-align:center;color:#777}.modalBg{position:fixed;inset:0;background:#000b;display:grid;place-items:center;padding:18px;z-index:20}.modal{width:min(610px,100%);background:#111315;border:1px solid #353a3f;border-radius:17px;padding:20px;box-shadow:0 30px 80px #000}.modal h3{margin:0 0 14px}.modal input{width:100%;margin-bottom:10px}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}@media(max-width:760px){.row{grid-template-columns:42px 1fr}.stat,.last{display:none}.hero h1{font-size:27px}.top{align-items:flex-start;flex-direction:column}}</style></head><body><main class="wrap"><header class="top"><div class="brand"><div class="cat">🐱</div><div><b>Tracker<span>Gatto</span></b><div style="font-size:10px;color:#f4bf28;font-weight:900;letter-spacing:.08em">FORUM COMMUNITY</div></div></div><div class="topRight"><span id="modeBadge" class="badge">● CARICAMENTO</span><button class="btn" onclick="location.href='home.html'">← Strumenti</button></div></header><div id="app"></div></main><div id="modalRoot"></div><script>const SB=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');const cats=[['calendar','🗓','Bonus - Calendario','Calendario promozioni e scadenze.','Bonus'],['welcome','🎁','Bonus - Benvenuto','Offerte di benvenuto e nuovi bookmaker.','Bonus'],['recurring','🔄','Bonus - Ricorrenti','Promozioni periodiche e ricorrenti.','Bonus'],['personal','👤','Bonus - Personali','Promozioni riservate e personali.','Bonus'],['archive','📁','Bonus - Archivio','Bonus conclusi e discussioni archiviate.','Bonus'],['strategy','📊','Strategie Matched Betting','Qualificanti, freebet, coperture e metodi.','Risorse'],['odds','⚽','Scommesse e Quote','Quote, mercati e analisi delle partite.','Risorse'],['general','💬','Discussioni Generali','Community, domande e confronto tra utenti.','Risorse']];let state={view:'home',cat:null,thread:null,user:null,remote:false,threads:[],posts:[]};const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const fmt=d=>{try{return new Date(d).toLocaleString('it-IT',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'})}catch{return d}};function loadLocal(){try{state.threads=JSON.parse(localStorage.getItem('tg_forum_threads')||'[]');state.posts=JSON.parse(localStorage.getItem('tg_forum_posts')||'[]')}catch{state.threads=[];state.posts=[]}}function saveLocal(){localStorage.setItem('tg_forum_threads',JSON.stringify(state.threads));localStorage.setItem('tg_forum_posts',JSON.stringify(state.posts))}function identity(){return{author_id:state.user?.id||'local',author_email:state.user?.email||'Utente locale'}}async function init(){const {data}=await SB.auth.getSession();state.user=data?.session?.user||null;try{const t=await SB.from('forum_threads').select('*').limit(1);if(t.error)throw t.error;state.remote=true;$('#modeBadge').textContent='● FORUM ONLINE';await refreshRemote()}catch(e){state.remote=false;loadLocal();$('#modeBadge').textContent='● MODALITÀ LOCALE'}renderHome()}async function refreshRemote(){const [t,p]=await Promise.all([SB.from('forum_threads').select('*').order('created_at',{ascending:false}),SB.from('forum_posts').select('*').order('created_at',{ascending:true})]);if(t.error)throw t.error;if(p.error)throw p.error;state.threads=t.data||[];state.posts=p.data||[]}function counts(cat){const ts=state.threads.filter(x=>x.category===cat),ids=new Set(ts.map(x=>String(x.id))),ps=state.posts.filter(x=>ids.has(String(x.thread_id)));return[ts.length,ts.length+ps.length]}function lastThread(cat){return state.threads.filter(x=>x.category===cat).sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at))[0]}function catRow(c){const [id,ico,name,desc]=c,[n,m]=counts(id),last=lastThread(id);return`<div class="row" onclick="openCategory('${id}')" data-search="${esc(name+' '+desc)}"><div class="ico">${ico}</div><div><div class="name">${esc(name)}</div><div class="desc">${esc(desc)}</div></div><div class="stat"><small>Discussioni</small>${n}</div><div class="stat"><small>Messaggi</small>${m}</div><div class="last">${last?`<b>${esc(last.title)}</b>${fmt(last.updated_at||last.created_at)}`:'Nessuna discussione'}</div></div>`}function renderHome(){state.view='home';const bonus=cats.filter(x=>x[4]==='Bonus'),res=cats.filter(x=>x[4]==='Risorse');$('#app').innerHTML=`<section class="hero"><h1>Forum - TrackerGatto Club</h1><p>Bonus, strategie, matched betting e discussioni della community.</p></section><div class="toolbar"><input id="forumSearch" class="search" placeholder="Ricerca categorie..." oninput="filterCats()"><span class="muted">${state.user?.email?esc(state.user.email):'Accesso locale'}</span></div><section class="group"><div class="groupTitle">🎁 Bonus</div>${bonus.map(catRow).join('')}</section><section class="group"><div class="groupTitle">📚 Risorse</div>${res.map(catRow).join('')}</section>${state.remote?'':'<div class="notice">Il forum è già utilizzabile su questo dispositivo. Per renderlo condiviso tra tutti gli utenti servono le tabelle Supabase forum_threads e forum_posts.</div>'}`}function filterCats(){const q=($('#forumSearch')?.value||'').toLowerCase();document.querySelectorAll('[data-search]').forEach(r=>r.style.display=!q||r.dataset.search.toLowerCase().includes(q)?'grid':'none')}async function openCategory(id){state.cat=id;state.view='category';if(state.remote)await refreshRemote();renderCategory()}function renderCategory(){const c=cats.find(x=>x[0]===state.cat),list=state.threads.filter(x=>x.category===state.cat).sort((a,b)=>new Date(b.updated_at||b.created_at)-new Date(a.updated_at||a.created_at));$('#app').innerHTML=`<section class="hero"><div class="crumb" onclick="renderHome()">← Forum</div><div class="headLine"><div><h1 style="font-size:28px">${c[1]} ${esc(c[2])}</h1><p>${esc(c[3])}</p></div><button class="btn gold" onclick="newThreadModal()">＋ Nuova discussione</button></div></section><div class="toolbar"><input id="threadSearch" class="search" placeholder="Cerca discussione..." oninput="filterThreads()"></div><section class="card" id="threadList">${list.length?list.map(threadRow).join(''):'<div class="empty">Nessuna discussione. Creane una!</div>'}</section>`}function threadRow(t){const replies=state.posts.filter(p=>String(p.thread_id)===String(t.id)).length;return`<div class="threadRow" data-threadsearch="${esc(t.title)}" onclick="openThread('${t.id}')"><div class="threadTitle">💬 ${esc(t.title)}</div><div class="meta">${esc(t.author_email||'Utente')} • ${fmt(t.created_at)} • ${replies} risposte</div></div>`}function filterThreads(){const q=($('#threadSearch')?.value||'').toLowerCase();document.querySelectorAll('[data-threadsearch]').forEach(r=>r.style.display=!q||r.dataset.threadsearch.toLowerCase().includes(q)?'block':'none')}async function openThread(id){state.thread=state.threads.find(x=>String(x.id)===String(id));if(!state.thread)return;if(state.remote)await refreshRemote();state.thread=state.threads.find(x=>String(x.id)===String(id));renderThread()}function own(x){return state.user?.id?x.author_id===state.user.id:x.author_email===(state.user?.email||'Utente locale')}function renderThread(){const t=state.thread,c=cats.find(x=>x[0]===t.category),ps=state.posts.filter(p=>String(p.thread_id)===String(t.id));$('#app').innerHTML=`<section class="hero"><div class="crumb" onclick="openCategory('${t.category}')">← ${esc(c?.[2]||'Categoria')}</div><h1 style="font-size:27px">${esc(t.title)}</h1><p>Discussione aperta da ${esc(t.author_email||'Utente')} • ${fmt(t.created_at)}</p></section><section class="card"><div class="post"><div class="postHead"><span class="author">${esc(t.author_email||'Utente')}</span><span class="muted">${fmt(t.created_at)}</span></div><div class="body">${esc(t.body)}</div>${own(t)?`<div class="actions"><button class="mini" onclick="editItem('thread','${t.id}')">Modifica</button><button class="mini danger" onclick="deleteItem('thread','${t.id}')">Elimina</button></div>`:''}</div>${ps.map(p=>`<div class="post"><div class="postHead"><span class="author">${esc(p.author_email||'Utente')}</span><span class="muted">${fmt(p.created_at)}</span></div><div class="body">${esc(p.body)}</div>${own(p)?`<div class="actions"><button class="mini" onclick="editItem('post','${p.id}')">Modifica</button><button class="mini danger" onclick="deleteItem('post','${p.id}')">Elimina</button></div>`:''}</div>`).join('')}<div class="composer"><textarea id="replyBody" placeholder="Scrivi una risposta..."></textarea><div style="margin-top:10px"><button class="btn gold" onclick="addReply()">Pubblica risposta</button></div></div></section>`}function newThreadModal(){showModal('Nuova discussione',`<input id="newTitle" placeholder="Titolo discussione"><textarea id="newBody" placeholder="Scrivi il messaggio..."></textarea>`,`createThread()`)}function showModal(title,body,ok){$('#modalRoot').innerHTML=`<div class="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>${title}</h3>${body}<div class="modalActions"><button class="btn" onclick="closeModal()">Annulla</button><button class="btn gold" onclick="${ok}">Salva</button></div></div></div>`}function closeModal(){$('#modalRoot').innerHTML=''}async function createThread(){const title=$('#newTitle').value.trim(),body=$('#newBody').value.trim();if(!title||!body)return alert('Inserisci titolo e messaggio.');const now=new Date().toISOString(),u=identity(),obj={category:state.cat,title,body,...u,created_at:now,updated_at:now};if(state.remote){const {error}=await SB.from('forum_threads').insert(obj);if(error)return alert(error.message);await refreshRemote()}else{obj.id='t'+Date.now();state.threads.unshift(obj);saveLocal()}closeModal();renderCategory()}async function addReply(){const body=$('#replyBody').value.trim();if(!body)return;const now=new Date().toISOString(),u=identity(),obj={thread_id:state.thread.id,body,...u,created_at:now,updated_at:now};if(state.remote){const {error}=await SB.from('forum_posts').insert(obj);if(error)return alert(error.message);await SB.from('forum_threads').update({updated_at:now}).eq('id',state.thread.id);await refreshRemote()}else{obj.id='p'+Date.now();state.posts.push(obj);state.thread.updated_at=now;saveLocal()}state.thread=state.threads.find(x=>String(x.id)===String(state.thread.id));renderThread()}function editItem(type,id){const arr=type==='thread'?state.threads:state.posts,item=arr.find(x=>String(x.id)===String(id));if(!item||!own(item))return;showModal('Modifica messaggio',`<textarea id="editBody">${esc(item.body)}</textarea>`,`saveEdit('${type}','${id}')`)}async function saveEdit(type,id){const body=$('#editBody').value.trim();if(!body)return;const table=type==='thread'?'forum_threads':'forum_posts',now=new Date().toISOString();if(state.remote){const {error}=await SB.from(table).update({body,updated_at:now}).eq('id',id);if(error)return alert(error.message);await refreshRemote()}else{const arr=type==='thread'?state.threads:state.posts,item=arr.find(x=>String(x.id)===String(id));item.body=body;item.updated_at=now;saveLocal()}closeModal();state.thread=state.threads.find(x=>String(x.id)===String(state.thread.id));renderThread()}async function deleteItem(type,id){if(!confirm('Vuoi eliminare questo contenuto?'))return;if(type==='thread'){if(state.remote){await SB.from('forum_posts').delete().eq('thread_id',id);const {error}=await SB.from('forum_threads').delete().eq('id',id);if(error)return alert(error.message);await refreshRemote()}else{state.threads=state.threads.filter(x=>String(x.id)!==String(id));state.posts=state.posts.filter(x=>String(x.thread_id)!==String(id));saveLocal()}return openCategory(state.cat)}if(state.remote){const {error}=await SB.from('forum_posts').delete().eq('id',id);if(error)return alert(error.message);await refreshRemote()}else{state.posts=state.posts.filter(x=>String(x.id)!==String(id));saveLocal()}state.thread=state.threads.find(x=>String(x.id)===String(state.thread.id));renderThread()}init();</script></body></html>
