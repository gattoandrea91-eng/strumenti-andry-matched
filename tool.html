<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Strumento</title><style>html,body{margin:0;height:100%;background:#070809}iframe{border:0;width:100%;height:100vh;display:block}</style></head><body><iframe id="legacy" src="index.html"></iframe><script>const allowed=['bonus','surebet','puntabanca','freebet','casino','blackjack','crypto'];const s=new URLSearchParams(location.search).get('section');const section=allowed.includes(s)?s:null;const f=document.getElementById('legacy');f.addEventListener('load',()=>{try{const w=f.contentWindow,d=f.contentDocument;if(section&&typeof w.openSection==='function')w.openSection(section);if(d){d.querySelectorAll('button').forEach(btn=>{if((btn.textContent||'').trim().toLowerCase()==='profit tracker'){btn.onclick=(e)=>{e.preventDefault();window.location.href='trackergatto.html';};}});const original=w.openSection;if(typeof original==='function'){w.openSection=function(id){if(id==='profitTracker'){window.location.href='trackergatto.html';return;}return original.call(w,id);};}}}catch(e){console.error(e)}});</script></body></html>
