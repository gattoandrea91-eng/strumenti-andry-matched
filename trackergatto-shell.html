<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackerGatto - Accesso</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--gold:#f3bd25;--line:#2a2e33;--muted:#9aa1a9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 60% 0,#17140b 0,#070809 40%,#030405 100%);color:#f5f5f5;font-family:Arial,sans-serif}.top{max-width:1400px;margin:18px auto 0;padding:15px 18px;border:1px solid #23272b;border-radius:16px;background:#090a0b;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;align-items:center;gap:12px}.cat{width:48px;height:48px;border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;font-size:26px}.brand b{font-size:24px}.brand span{color:var(--gold)}.sub{font-size:12px;color:var(--muted)}.back{border:1px solid #34383d;background:#171a1d;color:white;padding:10px 13px;border-radius:10px;font-weight:800;cursor:pointer}.card{width:min(460px,calc(100% - 30px));margin:55px auto;background:linear-gradient(180deg,#17191c,#111315);border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:0 18px 45px #0007}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;color:#d7d9dc;margin-bottom:6px}.field input{width:100%;background:#090b0d;border:1px solid #30343a;color:#fff;padding:12px;border-radius:9px}.btn{border:0;background:linear-gradient(180deg,#f5c535,#d49a00);color:#201600;padding:11px 16px;border-radius:10px;font-weight:900;cursor:pointer}.link{display:block;margin-top:13px;border:0;background:none;color:var(--gold);padding:0;text-decoration:underline;cursor:pointer;font-weight:800}.msg{font-size:12px;color:var(--muted);margin-top:11px;line-height:1.45}.hidden{display:none}</style></head><body>
<div class="top"><div class="brand"><div class="cat">🐱</div><div><b>Tracker<span>Gatto</span></b><div class="sub">Conti, movimenti e puntate</div></div></div><button class="back" onclick="location.href='/'">← Strumenti</button></div>
<div id="loginCard" class="card"><h2>Accesso privato</h2><div class="field"><label>Email</label><input id="emailInput" type="email" autocomplete="email"></div><div class="field"><label>Password</label><input id="passwordInput" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn">Entra</button><button id="forgotBtn" class="link">Password dimenticata?</button><div id="loginMsg" class="msg">Usa lo stesso account del Profit Tracker.</div></div>
<div id="resetCard" class="card hidden"><h2>Imposta nuova password</h2><div class="field"><label>Nuova password</label><input id="newPassword" type="password" minlength="6"></div><div class="field"><label>Ripeti password</label><input id="newPassword2" type="password" minlength="6"></div><button id="savePasswordBtn" class="btn">Salva nuova password</button><div id="resetMsg" class="msg"></div></div>
<script>
const client=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');
const $=id=>document.getElementById(id);
async function goIfLogged(){const {data}=await client.auth.getSession();if(data?.session&&!location.hash.includes('type=recovery')) location.replace('/trackergatto-v2.html')}
$('loginBtn').addEventListener('click',async()=>{const email=$('emailInput').value.trim(),password=$('passwordInput').value;$('loginMsg').textContent='Accesso in corso...';if(!email||!password){$('loginMsg').textContent='Inserisci email e password.';return}try{const {data,error}=await client.auth.signInWithPassword({email,password});if(error){$('loginMsg').textContent=error.message;return}if(!data?.session){$('loginMsg').textContent='Login non completato.';return}location.replace('/trackergatto-v2.html')}catch(e){$('loginMsg').textContent='Errore: '+e.message}});
$('passwordInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('loginBtn').click()});
$('forgotBtn').addEventListener('click',async()=>{const email=$('emailInput').value.trim()||prompt('Inserisci la tua email:','');if(!email)return;$('loginMsg').textContent='Invio email...';const {error}=await client.auth.resetPasswordForEmail(email,{redirectTo:'https://strumenti-andry-matched.vercel.app/trackergatto.html'});$('loginMsg').textContent=error?error.message:'Email inviata. Controlla la posta.'});
client.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY'){ $('loginCard').classList.add('hidden');$('resetCard').classList.remove('hidden')}});
if(location.hash.includes('type=recovery')){$('loginCard').classList.add('hidden');$('resetCard').classList.remove('hidden')}
$('savePasswordBtn').addEventListener('click',async()=>{const p=$('newPassword').value,p2=$('newPassword2').value;if(p.length<6){$('resetMsg').textContent='Minimo 6 caratteri.';return}if(p!==p2){$('resetMsg').textContent='Le password non coincidono.';return}$('resetMsg').textContent='Salvataggio...';const {error}=await client.auth.updateUser({password:p});if(error){$('resetMsg').textContent=error.message;return}$('resetMsg').textContent='Password aggiornata.';setTimeout(()=>location.replace('/trackergatto-v2.html'),800)});
goIfLogged();
</script></body></html>
