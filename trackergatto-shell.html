<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TrackerGatto</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>html,body{margin:0;height:100%;background:#070809}iframe{border:0;width:100%;height:100vh;display:block}.reset{position:fixed;inset:0;background:#000c;display:none;place-items:center;padding:20px;z-index:9999;font-family:Arial,sans-serif}.reset.show{display:grid}.box{width:min(460px,100%);background:linear-gradient(180deg,#17191c,#111315);border:1px solid #2a2e33;border-radius:18px;padding:22px;color:#fff;box-shadow:0 20px 50px #0008}.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px}.cat{width:46px;height:46px;border:2px solid #f3bd25;border-radius:50%;display:grid;place-items:center;font-size:25px}.brand b{font-size:23px}.brand span{color:#f3bd25}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:6px;color:#d7d9dc}.field input{width:100%;box-sizing:border-box;background:#090b0d;border:1px solid #30343a;color:#fff;padding:12px;border-radius:10px}.btn{width:100%;border:0;background:linear-gradient(180deg,#f5c535,#d49a00);color:#201600;padding:12px;border-radius:10px;font-weight:900;cursor:pointer}.msg{font-size:12px;color:#9aa1a9;margin-top:10px;line-height:1.5}</style></head><body><iframe id="tg" src="trackergatto-v2.html"></iframe><div id="resetBox" class="reset"><div class="box"><div class="brand"><div class="cat">🐱</div><b>Tracker<span>Gatto</span></b></div><h2 style="margin:0 0 8px">Imposta nuova password</h2><div class="msg" style="margin-bottom:14px">Inserisci la nuova password per il tuo account.</div><div class="field"><label>Nuova password</label><input id="newPass" type="password" minlength="6"></div><div class="field"><label>Ripeti password</label><input id="newPass2" type="password" minlength="6"></div><button class="btn" onclick="saveNewPassword()">Salva nuova password</button><div id="resetMsg" class="msg"></div></div></div><script>const SB=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');const f=document.getElementById('tg');function inject(){try{const d=f.contentDocument,w=f.contentWindow;if(!d)return;const login=d.getElementById('loginBox');if(login&&!d.getElementById('forgotTg')){const a=d.createElement('button');a.id='forgotTg';a.textContent='Password dimenticata?';a.style.cssText='margin-top:12px;background:none;border:0;color:#f3bd25;text-decoration:underline;cursor:pointer;font-weight:800;padding:0';a.onclick=async()=>{const email=d.getElementById('email')?.value?.trim()||prompt('Inserisci la tua email:','');if(!email)return;const r=await SB.auth.resetPasswordForEmail(email,{redirectTo:'https://strumenti-andry-matched.vercel.app/trackergatto.html'});const msg=d.getElementById('loginMsg');if(r.error){if(msg)msg.textContent=r.error.message}else{if(msg)msg.textContent='Email di recupero inviata. Controlla la posta.'}};login.appendChild(a)}if(w&&typeof w.logout==='function'){const old=w.logout;w.logout=async function(){await old();location.href='trackergatto.html'}}}catch(e){console.error(e)}}f.addEventListener('load',inject);SB.auth.onAuthStateChange((event)=>{if(event==='PASSWORD_RECOVERY')document.getElementById('resetBox').classList.add('show')});if(location.hash.includes('type=recovery'))document.getElementById('resetBox').classList.add('show');async function saveNewPassword(){const p=newPass.value,p2=newPass2.value;if(p.length<6){resetMsg.textContent='La password deve avere almeno 6 caratteri.';return}if(p!==p2){resetMsg.textContent='Le password non coincidono.';return}resetMsg.textContent='Salvataggio...';const r=await SB.auth.updateUser({password:p});if(r.error){resetMsg.textContent=r.error.message;return}resetMsg.textContent='Password aggiornata. Puoi accedere con la nuova password.';setTimeout(()=>{location.href='trackergatto.html'},1300)}</script></body></html>
