name: Add quantity selector to Reserved Orders
on:
  push:
    paths:
      - '.github/workflows/add-order-quantity.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch ordini-riservati
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ordini-riservati.html')
          s=p.read_text()
          s=s.replace('<div class="field"><label>Prodotto</label><input id="product" placeholder="Nome prodotto"></div><div class="field"><label>Prezzo pagato dal cliente (€)</label><input id="theirPrice" type="number" step="0.01" min="0" placeholder="0,00"></div>', '<div class="field"><label>Prodotto</label><input id="product" placeholder="Nome prodotto"></div><div class="field"><label>Quantità</label><select id="quantity"></select></div><div class="field"><label>Prezzo cliente singolo (€)</label><input id="unitPrice" type="number" step="0.01" min="0" placeholder="0,00"></div><div class="field"><label>Totale cliente</label><input id="theirPrice" disabled value="€ 0,00"></div>')
          s=s.replace('<th>Cliente</th><th>Prodotto</th><th>Pagato cliente</th>', '<th>Cliente</th><th>Prodotto</th><th>Qtà</th><th>Pagato cliente</th>')
          s=s.replace("orders=orders.map(x=>({...x,theirPrice:Number(x.theirPrice||0),purchaseGroupId:x.purchaseGroupId||null}));", "orders=orders.map(x=>{const q=Math.max(1,Number(x.quantity||1));const total=Number(x.theirPrice||0);const unit=Number.isFinite(Number(x.unitPrice))?Number(x.unitPrice):(q?total/q:total);return {...x,quantity:q,unitPrice:unit,theirPrice:unit*q,purchaseGroupId:x.purchaseGroupId||null}});")
          s=s.replace("function resetForm(){editing=null;$('formTitle').textContent='Nuovo ordine';$('saveBtn').textContent='Salva ordine';$('cancelBtn').classList.add('hidden');$('customer').value='';$('product').value='';$('theirPrice').value='';$('payment').value='NON PAGATO';$('delivery').value='DA ARRIVARE';$('orderDate').value=today()}", "function fillQuantity(v=1){const q=$('quantity');q.innerHTML='';for(let i=1;i<=20;i++)q.insertAdjacentHTML('beforeend',`<option value=\"${i}\">${i}</option>`);q.value=String(Math.min(20,Math.max(1,Number(v)||1)))}function updateOrderTotal(){const q=Math.max(1,Number($('quantity').value||1)),u=Number($('unitPrice').value||0);$('theirPrice').value=euro(q*u)}function resetForm(){editing=null;$('formTitle').textContent='Nuovo ordine';$('saveBtn').textContent='Salva ordine';$('cancelBtn').classList.add('hidden');$('customer').value='';$('product').value='';fillQuantity(1);$('unitPrice').value='';updateOrderTotal();$('payment').value='NON PAGATO';$('delivery').value='DA ARRIVARE';$('orderDate').value=today()}")
          s=s.replace("function save(){const customer=$('customer').value.trim(),product=$('product').value.trim(),theirPrice=Number($('theirPrice').value),payment=$('payment').value,delivery=$('delivery').value,orderDate=$('orderDate').value||today();if(!customer||!product||!Number.isFinite(theirPrice)){alert('Compila cliente, prodotto e prezzo pagato dal cliente.');return}const old=editing?orders.find(x=>x.id===editing):null,row={...(old||{}),id:editing||crypto.randomUUID(),customer,product,theirPrice,payment,delivery,orderDate,createdAt:old?.createdAt||new Date().toISOString(),purchaseGroupId:old?.purchaseGroupId||null};", "function save(){const customer=$('customer').value.trim(),product=$('product').value.trim(),quantity=Math.max(1,Number($('quantity').value||1)),unitPrice=Number($('unitPrice').value),theirPrice=quantity*unitPrice,payment=$('payment').value,delivery=$('delivery').value,orderDate=$('orderDate').value||today();if(!customer||!product||!Number.isFinite(unitPrice)){alert('Compila cliente, prodotto, quantità e prezzo singolo.');return}const old=editing?orders.find(x=>x.id===editing):null,row={...(old||{}),id:editing||crypto.randomUUID(),customer,product,quantity,unitPrice,theirPrice,payment,delivery,orderDate,createdAt:old?.createdAt||new Date().toISOString(),purchaseGroupId:old?.purchaseGroupId||null};")
          s=s.replace("$('customer').value=x.customer;$('product').value=x.product;$('theirPrice').value=x.theirPrice;$('payment').value=x.payment;", "$('customer').value=x.customer;$('product').value=x.product;fillQuantity(x.quantity||1);$('unitPrice').value=Number.isFinite(Number(x.unitPrice))?x.unitPrice:Number(x.theirPrice||0)/(Number(x.quantity||1)||1);updateOrderTotal();$('payment').value=x.payment;")
          s=s.replace("<td>${esc(x.customer)}</td><td>${esc(x.product)}</td><td class=\"money\">${euro(x.theirPrice)}</td>", "<td>${esc(x.customer)}</td><td>${esc(x.product)}</td><td><b>${Number(x.quantity||1)}</b></td><td class=\"money\">${euro(x.theirPrice)}</td>")
          s=s.replace("$'saveBtn'", "$'saveBtn'")
          marker="$('saveBtn').onclick=save;"
          if marker in s and "$('quantity').onchange=updateOrderTotal" not in s:
              s=s.replace(marker,"$('quantity').onchange=updateOrderTotal;$('unitPrice').oninput=updateOrderTotal;"+marker)
          s=s.replace("colspan=\"9\"", "colspan=\"10\"")
          p.write_text(s)
          PY
          node - <<'NODE'
          const fs=require('fs'),s=fs.readFileSync('ordini-riservati.html','utf8');
          const m=s.match(/<script>\n([\s\S]*?)<\/script><\/body>/); if(!m) throw new Error('script not found'); fs.writeFileSync('/tmp/ordini.js',m[1]);
          NODE
          node --check /tmp/ordini.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ordini-riservati.html
          git commit -m 'Add adaptive quantity to Reserved Orders'
          git pull --rebase origin main
          git push origin main
