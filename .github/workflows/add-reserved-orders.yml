name: Add Reserved Orders page
on:
  push:
    paths:
      - '.github/workflows/add-reserved-orders.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Add button and page
        run: |
          python3 - <<'PY'
          from pathlib import Path
          home=Path('home-odds.html')
          s=home.read_text()
          anchor="<button class=\"tool featured\" onclick=\"location.href='spese.html'\"><div class=\"icon\">💸</div><b>Spese</b><small>Mutuo, bollette, spesa, benzina e extra.</small></button>"
          btn=anchor+"<button class=\"tool featured\" onclick=\"location.href='ordini-riservati.html'\"><div class=\"icon\">📦</div><b>Ordini Riservati</b><small>Clienti, costi, incassi, guadagno e stato ordini.</small></button>"
          if "ordini-riservati.html" not in s:
              if anchor not in s: raise SystemExit('Spese button anchor not found')
              s=s.replace(anchor,btn,1)
              home.write_text(s)
          PY
          cat > ordini-riservati.html <<'HTML'
          <!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ordini Riservati</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>
          :root{--bg:#070809;--panel:#121416;--line:#2b2f33;--txt:#f5f5f5;--muted:#9ca3aa;--gold:#f3bd25;--green:#42d879;--red:#ff6b57}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#070809,#101214);color:var(--txt);font-family:Arial,sans-serif}.wrap{max-width:1450px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:15px 18px;border:1px solid #23272b;border-radius:16px;background:#090a0b;position:sticky;top:8px;z-index:10}.brand b{font-size:25px}.brand span{color:var(--gold)}.sub{font-size:12px;color:var(--muted);margin-top:3px}.btn{border:1px solid #34383d;background:#171a1d;color:#fff;padding:10px 13px;border-radius:10px;cursor:pointer;font-weight:800}.gold{background:linear-gradient(180deg,#f5c535,#d49a00);color:#211700;border:0}.red{background:#401a18;color:#ffb5aa}.card{margin-top:16px;background:linear-gradient(180deg,#17191c,#111315);border:1px solid var(--line);border-radius:17px;padding:18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:16px}.k{color:var(--gold);font-size:12px;font-weight:900;text-transform:uppercase}.v{font-size:25px;font-weight:900;margin-top:6px}.title{display:flex;justify-content:space-between;align-items:center;gap:10px}.title h2{margin:0}.formgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:15px}.field label{display:block;font-size:12px;font-weight:800;color:#d7d9dc;margin-bottom:6px}input,select{width:100%;background:#090b0d;border:1px solid #30343a;color:#fff;padding:11px;border-radius:9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.tablewrap{overflow:auto;margin-top:12px}table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-top:1px solid #292d31;text-align:left;font-size:13px;white-space:nowrap}th{color:#b8bec5}.money{font-weight:900}.profit{color:#8ce6a4;font-weight:900}.loss{color:#ff8b7b;font-weight:900}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-weight:900;font-size:11px}.paid{background:#123b20;color:#91efaa}.unpaid{background:#421b17;color:#ff9d8e}.arrived{background:#123b20;color:#91efaa}.waiting{background:#49390e;color:#ffdb6e}.empty{text-align:center;color:#777;padding:24px}.note{font-size:12px;color:var(--muted);margin-top:8px}@media(max-width:950px){.stats,.formgrid{grid-template-columns:1fr 1fr}}@media(max-width:560px){.stats,.formgrid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
          </style></head><body><div class="wrap"><div class="top"><div class="brand"><b>Ordini <span>Riservati</span></b><div class="sub">Gestione ordini clienti e guadagni</div></div><div><button class="btn" onclick="location.href='home-odds.html'">← Dashboard</button></div></div><div class="stats"><div class="card"><div class="k">Ordini</div><div class="v" id="count">0</div></div><div class="card"><div class="k">Incassato clienti</div><div class="v" id="revenue">€ 0,00</div></div><div class="card"><div class="k">Costo nostro</div><div class="v" id="cost">€ 0,00</div></div><div class="card"><div class="k">Guadagno</div><div class="v" id="profit">€ 0,00</div></div></div><div class="card"><div class="title"><h2 id="formTitle">Nuovo ordine</h2></div><div class="formgrid"><div class="field"><label>Nome cliente</label><input id="customer" placeholder="Nome di chi ha ordinato"></div><div class="field"><label>Prodotto</label><input id="product" placeholder="Nome prodotto"></div><div class="field"><label>Prezzo pagato da noi (€)</label><input id="ourPrice" type="number" step="0.01" min="0" placeholder="0,00"></div><div class="field"><label>Prezzo pagato dal cliente (€)</label><input id="theirPrice" type="number" step="0.01" min="0" placeholder="0,00"></div><div class="field"><label>Pagamento</label><select id="payment"><option value="NON PAGATO">Non pagato</option><option value="PAGATO">Pagato</option></select></div><div class="field"><label>Consegna</label><select id="delivery"><option value="DA ARRIVARE">Da arrivare</option><option value="ARRIVATO">Arrivato</option></select></div><div class="field"><label>Data ordine</label><input id="orderDate" type="date"></div><div class="field"><label>Guadagno</label><input id="gainPreview" disabled value="€ 0,00"></div></div><div class="actions"><button class="btn gold" id="saveBtn">Salva ordine</button><button class="btn hidden" id="cancelBtn">Annulla modifica</button></div><div class="note">Il guadagno viene calcolato automaticamente: prezzo cliente − prezzo pagato da noi.</div></div><div class="card"><div class="title"><h2>Ordini inseriti</h2></div><div class="tablewrap"><table><thead><tr><th>Data</th><th>Cliente</th><th>Prodotto</th><th>Costo nostro</th><th>Pagato cliente</th><th>Guadagno</th><th>Pagamento</th><th>Consegna</th><th>Opzioni</th></tr></thead><tbody id="body"></tbody></table></div></div></div><script>
          const SB=window.supabase.createClient('https://aihwrkqfzhwedqdbxbxh.supabase.co','sb_publishable_G_glT9ld2cqENlVSup38NQ_q8HWyZPd');let currentUser=null,orders=[],editing=null;const $=id=>document.getElementById(id);const euro=v=>'€ '+Number(v||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});const today=()=>new Date().toISOString().slice(0,10);function key(){return 'reserved_orders_'+(currentUser?.email||'guest').toLowerCase()}function load(){try{orders=JSON.parse(localStorage.getItem(key())||'[]')}catch{orders=[]}render()}function persist(){localStorage.setItem(key(),JSON.stringify(orders));render()}function preview(){const a=Number($('ourPrice').value||0),b=Number($('theirPrice').value||0);$('gainPreview').value=euro(b-a)}$('ourPrice').addEventListener('input',preview);$('theirPrice').addEventListener('input',preview);function resetForm(){editing=null;$('formTitle').textContent='Nuovo ordine';$('saveBtn').textContent='Salva ordine';$('cancelBtn').classList.add('hidden');$('customer').value='';$('product').value='';$('ourPrice').value='';$('theirPrice').value='';$('payment').value='NON PAGATO';$('delivery').value='DA ARRIVARE';$('orderDate').value=today();preview()}function save(){const customer=$('customer').value.trim(),product=$('product').value.trim(),ourPrice=Number($('ourPrice').value),theirPrice=Number($('theirPrice').value),payment=$('payment').value,delivery=$('delivery').value,orderDate=$('orderDate').value||today();if(!customer||!product||!Number.isFinite(ourPrice)||!Number.isFinite(theirPrice)){alert('Compila cliente, prodotto e prezzi.');return}const row={id:editing||crypto.randomUUID(),customer,product,ourPrice,theirPrice,payment,delivery,orderDate,createdAt:new Date().toISOString()};if(editing){orders=orders.map(x=>x.id===editing?{...x,...row}:x)}else orders.unshift(row);persist();resetForm()}function edit(id){const x=orders.find(o=>o.id===id);if(!x)return;editing=id;$('formTitle').textContent='Modifica ordine';$('saveBtn').textContent='Salva modifica';$('cancelBtn').classList.remove('hidden');$('customer').value=x.customer;$('product').value=x.product;$('ourPrice').value=x.ourPrice;$('theirPrice').value=x.theirPrice;$('payment').value=x.payment;$('delivery').value=x.delivery;$('orderDate').value=x.orderDate;preview();scrollTo({top:0,behavior:'smooth'})}function del(id){if(!confirm('Eliminare questo ordine?'))return;orders=orders.filter(x=>x.id!==id);persist()}function setStatus(id,field,value){orders=orders.map(x=>x.id===id?{...x,[field]:value}:x);persist()}function render(){const totalCost=orders.reduce((s,x)=>s+Number(x.ourPrice||0),0),totalRevenue=orders.reduce((s,x)=>s+Number(x.theirPrice||0),0),totalProfit=totalRevenue-totalCost;$('count').textContent=orders.length;$('revenue').textContent=euro(totalRevenue);$('cost').textContent=euro(totalCost);$('profit').textContent=euro(totalProfit);$('body').innerHTML=orders.length?orders.map(x=>{const g=Number(x.theirPrice)-Number(x.ourPrice);return `<tr><td>${x.orderDate||''}</td><td>${esc(x.customer)}</td><td>${esc(x.product)}</td><td class="money">${euro(x.ourPrice)}</td><td class="money">${euro(x.theirPrice)}</td><td class="${g>=0?'profit':'loss'}">${euro(g)}</td><td><select onchange="setStatus('${x.id}','payment',this.value)"><option ${x.payment==='NON PAGATO'?'selected':''}>NON PAGATO</option><option ${x.payment==='PAGATO'?'selected':''}>PAGATO</option></select></td><td><select onchange="setStatus('${x.id}','delivery',this.value)"><option ${x.delivery==='DA ARRIVARE'?'selected':''}>DA ARRIVARE</option><option ${x.delivery==='ARRIVATO'?'selected':''}>ARRIVATO</option></select></td><td><button class="btn" onclick="edit('${x.id}')">Modifica</button> <button class="btn red" onclick="del('${x.id}')">Elimina</button></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Nessun ordine inserito.</td></tr>'}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('saveBtn').onclick=save;$('cancelBtn').onclick=resetForm;async function boot(){const {data}=await SB.auth.getSession();currentUser=data?.session?.user||null;if(!currentUser){location.href='home-odds.html';return}resetForm();load()}boot();
          </script></body></html>
          HTML
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add home-odds.html ordini-riservati.html
          git commit -m "Add standalone Reserved Orders tool"
          git pull --rebase origin main
          git push origin main
