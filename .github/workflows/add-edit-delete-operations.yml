name: Add TrackerGatto Edit Delete Operations
on:
  push:
    paths:
      - '.github/workflows/add-edit-delete-operations.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch operation edit delete support
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('trackergatto-v2.html')
          s=p.read_text()
          if 'function deletePBOperation' in s:
              print('Operation tools already present')
              raise SystemExit(0)

          # Headers
          old='<th>Data</th><th>Tipo</th><th>Conto</th><th>Wallet</th><th>Importo</th><th>Descrizione</th></tr></thead><tbody id="movesBody">'
          new='<th>Data</th><th>Tipo</th><th>Conto</th><th>Wallet</th><th>Importo</th><th>Descrizione</th><th>Opzioni</th></tr></thead><tbody id="movesBody">'
          if old not in s: raise SystemExit('movements header marker missing')
          s=s.replace(old,new,1)
          old='<th>Data</th><th>Conto</th><th>Metodo</th><th>Note</th><th>Movimento</th></tr></thead><tbody id="quickBetsBody">'
          new='<th>Data</th><th>Conto</th><th>Metodo</th><th>Note</th><th>Movimento</th><th>Opzioni</th></tr></thead><tbody id="quickBetsBody">'
          if old not in s: raise SystemExit('quick header marker missing')
          s=s.replace(old,new,1)

          # Render movements
          old='''movesBody.innerHTML=movements.length?movements.map(m=>`<tr><td>${esc(m.movement_date)}</td><td>${esc(m.movement_type)}</td><td>${esc(accountName(m.account_id))}</td><td>${esc(walletName(m.wallet_id))}</td><td class="money">${euro(m.amount)}</td><td>${esc(m.description||'—')}</td></tr>`).join(''):'<tr><td colspan="6" class="empty">Nessun movimento</td></tr>';'''
          new='''movesBody.innerHTML=movements.length?movements.map(m=>`<tr><td>${esc(m.movement_date)}</td><td>${esc(m.movement_type)}</td><td>${esc(accountName(m.account_id))}</td><td>${esc(walletName(m.wallet_id))}</td><td class="money">${euro(m.amount)}</td><td>${esc(movementDescription(m))}</td><td><div class="actions"><button class="btn blue" onclick="openEditMovement('${m.id}')">Modifica</button><button class="btn red" onclick="deleteMovementOperation('${m.id}')">Elimina</button></div></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nessun movimento</td></tr>';'''
          if old not in s: raise SystemExit('movement render marker missing')
          s=s.replace(old,new,1)

          # Render standard bets
          start=s.find('betsBody.innerHTML=normalBets.length?')
          end=s.find(';quickBetsBody.innerHTML=',start)
          if start<0 or end<0: raise SystemExit('bets render block missing')
          betrender='''betsBody.innerHTML=normalBets.length?normalBets.map(b=>`<tr><td>${esc(b.bet_date)}</td><td>${esc(accountName(b.account_id))}</td><td>${esc(b.description||'—')}</td><td>${euro(b.stake)}</td><td>${Number(b.odds).toFixed(2)}</td><td><span class="pill ${b.status==='WIN'?'win':b.status==='LOSS'?'loss':b.status==='VOID'?'void':'pending'}">${b.status}</span></td><td>${b.status==='PENDING'?'—':euro(b.profit)}</td><td><div class="actions">${b.status==='PENDING'?`<button class="btn green" onclick="settleBet('${b.id}','WIN')">WIN</button><button class="btn red" onclick="settleBet('${b.id}','LOSS')">LOSS</button><button class="btn blue" onclick="settleBet('${b.id}','VOID')">VOID</button>`:''}<button class="btn blue" onclick="openEditBet('${b.id}')">Modifica</button><button class="btn red" onclick="deleteBetOperation('${b.id}')">Elimina</button></div></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Nessuna puntata</td></tr>'''
          s=s[:start]+betrender+s[end:]

          # Render quick bets
          start=s.find('quickBetsBody.innerHTML=quickBets.length?')
          end=s.find('}function closeModal',start)
          if start<0 or end<0: raise SystemExit('quick render block missing')
          quickrender='''quickBetsBody.innerHTML=quickBets.length?quickBets.map(b=>{const q=quickParts(b),mv=Number(b.profit||0);return`<tr><td>${esc(b.bet_date)}</td><td>${esc(accountName(b.account_id))}</td><td>${esc(q.method)}</td><td>${esc(q.note||'—')}</td><td class="${mv>=0?'money':'neg'}">${mv>=0?'+':''}${euro(mv)}</td><td><div class="actions"><button class="btn blue" onclick="openEditQuickBet('${b.id}')">Modifica</button><button class="btn red" onclick="deleteBetOperation('${b.id}')">Elimina</button></div></td></tr>`}).join(''):'<tr><td colspan="6" class="empty">Nessuna giocata rapida</td></tr>'''
          s=s[:start]+quickrender+s[end:]

          # Render PB action buttons
          start=s.find('function renderPB(rows){')
          end=s.find('function openPBModal(){',start)
          if start<0 or end<0: raise SystemExit('PB render block missing')
          pbrender='''function renderPB(rows){if(!window.pbBody)return;const groups=pbGroups(rows);pbBody.innerHTML=groups.length?groups.map(g=>{const pp=pbParts(g.punta),bp=pbParts(g.banca),liab=Number(g.banca.stake||0),closed=g.punta.status!=='PENDING'&&g.banca.status!=='PENDING';return`<tr><td>${esc(g.punta.bet_date||'')}</td><td>${esc(pp.event||bp.event||'—')}</td><td><b>${esc(accountName(g.punta.account_id))}</b><br>${euro(pp.backStake)} @ ${Number(pp.backOdds).toFixed(2)}</td><td><b>${esc(accountName(g.banca.account_id))}</b><br>${euro(bp.layStake)} @ ${Number(bp.layOdds).toFixed(2)} · ${Number(bp.commission).toFixed(2)}%</td><td class="neg">${euro(liab)}</td><td>${pbOutcomeText(g.punta)}</td><td>${pbOutcomeText(g.banca)}</td><td><span class="pill ${closed?'win':'pending'}">${closed?'CHIUSA':'IN CORSO'}</span></td><td><div class="actions">${closed?'':`<button class="btn gold" onclick="openPBCloseModal('${g.id}')">Chiudi PB</button>`}<button class="btn blue" onclick="openEditPB('${g.id}')">Modifica</button><button class="btn red" onclick="deletePBOperation('${g.id}')">Elimina</button></div></td></tr>`}).join(''):'<tr><td colspan="9" class="empty">Nessuna PB</td></tr>'''
          s=s[:start]+pbrender+s[end:]

          # Helpers and edit/delete functions
          marker='function openMovementModal(){'
          if marker not in s: raise SystemExit('movement function marker missing')
          funcs=r'''function betBalanceEffect(b){if(isQuickBet(b))return Number(b.profit||0);if(b.status==='PENDING')return-Number(b.stake||0);if(b.status==='WIN')return Number(b.profit||0);if(b.status==='LOSS')return-Number(b.stake||0);return 0}function addDelta(obj,id,v){if(!id||!Number.isFinite(Number(v))||Math.abs(Number(v))<.000001)return;obj[id]=(obj[id]||0)+Number(v)}async function applyBalanceChanges(accountDeltas={},walletDeltas={}){const changes=[];for(const[id,delta]of Object.entries(accountDeltas)){const x=accounts.find(a=>a.id===id);if(!x)return{ok:false,error:'Conto non trovato'};const old=Number(x.balance||0),next=old+Number(delta||0);if(next<-.005)return{ok:false,error:`Saldo insufficiente su ${accountName(id)}`};changes.push({table:'tracker_accounts',id,old,next})}for(const[id,delta]of Object.entries(walletDeltas)){const x=wallets.find(w=>w.id===id);if(!x)return{ok:false,error:'Wallet non trovato'};const old=Number(x.balance||0),next=old+Number(delta||0);if(next<-.005)return{ok:false,error:`Saldo insufficiente su ${walletName(id)}`};changes.push({table:'tracker_wallets',id,old,next})}const done=[];for(const c of changes){const r=await SUPA.from(c.table).update({balance:Number(c.next.toFixed(2))}).eq('id',c.id);if(r.error){for(const d of done.reverse())await SUPA.from(d.table).update({balance:d.old}).eq('id',d.id);return{ok:false,error:r.error.message}}done.push(c)}return{ok:true,changes}}async function restoreBalanceChanges(state){for(const c of(state?.changes||[]))await SUPA.from(c.table).update({balance:c.old}).eq('id',c.id)}function movementDescription(m){const d=String(m?.description||'');if(d.startsWith('WALLET_TRANSFER|'))return d.split('|').slice(3).join('|')||'Trasferimento wallet';if(d.startsWith('WALLET_ADJUST|'))return d.split('|').slice(1).join('|')||m.movement_type;return d||'—'}function movementTransferTo(m){const p=String(m?.description||'').split('|');return p[0]==='WALLET_TRANSFER'?(p[2]||''):''}function movementEffects(m){const a={},w={},amount=Math.abs(Number(m?.amount||0)),type=String(m?.movement_type||'');if(type==='PRELIEVO'){addDelta(a,m.account_id,-amount);addDelta(w,m.wallet_id,amount)}else if(type==='DEPOSITO'){addDelta(a,m.account_id,amount);addDelta(w,m.wallet_id,-amount)}else if(type==='WALLET_TRANSFER'){addDelta(w,m.wallet_id,-amount);addDelta(w,movementTransferTo(m),amount)}else if(type==='RICARICA'){addDelta(w,m.wallet_id,amount)}else if(type==='SPESA'){addDelta(w,m.wallet_id,-amount)}return{a,w}}function movementNewEffects(type,amount,accountId,walletId,walletToId){const m={movement_type:type,amount,account_id:accountId,wallet_id:walletId,description:type==='WALLET_TRANSFER'?`WALLET_TRANSFER|${walletId}|${walletToId}|`:''};return movementEffects(m)}function openEditMovement(id){const m=movements.find(x=>x.id===id);if(!m)return alert('Movimento non trovato');const t=m.movement_type,to=movementTransferTo(m);showModal('Modifica movimento',`<div class="warn">PRELIEVO/DEPOSITO usano Conto + Wallet A. RICARICA/SPESA usano Wallet A. TRASFERIMENTO usa Wallet A → Wallet B.</div><div class="row"><div class="field"><label>Tipo</label><select id="eMoveType"><option value="PRELIEVO" ${t==='PRELIEVO'?'selected':''}>PRELIEVO</option><option value="DEPOSITO" ${t==='DEPOSITO'?'selected':''}>DEPOSITO</option><option value="RICARICA" ${t==='RICARICA'?'selected':''}>RICARICA</option><option value="SPESA" ${t==='SPESA'?'selected':''}>SPESA</option><option value="WALLET_TRANSFER" ${t==='WALLET_TRANSFER'?'selected':''}>TRASFERIMENTO WALLET</option></select></div><div class="field"><label>Data</label><input id="eMoveDate" type="date" value="${esc(m.movement_date||today())}"></div><div class="field"><label>Importo</label><input id="eMoveAmount" type="number" step="0.01" value="${Number(m.amount||0)}"></div></div><div class="row"><div class="field"><label>Conto bookmaker</label><select id="eMoveAccount">${accountOpts(m.account_id)}</select></div><div class="field"><label>Wallet A / Da</label><select id="eMoveWallet">${walletGroupedOpts(m.wallet_id)}</select></div><div class="field"><label>Wallet B / A</label><select id="eMoveWalletTo">${walletGroupedOpts(to)}</select></div></div><div class="field"><label>Descrizione</label><input id="eMoveDesc" value="${esc(movementDescription(m)==='—'?'':movementDescription(m))}"></div><button class="btn gold" onclick="saveEditMovement('${id}')">Salva modifica</button>`)}async function saveEditMovement(id){const old=movements.find(x=>x.id===id);if(!old)return alert('Movimento non trovato');const type=eMoveType.value,amount=Math.abs(Number(eMoveAmount.value||0)),accountId=eMoveAccount.value,walletId=eMoveWallet.value,walletToId=eMoveWalletTo.value;if(!amount)return alert('Importo non valido');if((type==='PRELIEVO'||type==='DEPOSITO')&&(!accountId||!walletId))return alert('Scegli conto e wallet');if((type==='RICARICA'||type==='SPESA')&&!walletId)return alert('Scegli il wallet');if(type==='WALLET_TRANSFER'&&(!walletId||!walletToId||walletId===walletToId))return alert('Scegli due wallet diversi');const oe=movementEffects(old),ne=movementNewEffects(type,amount,accountId,walletId,walletToId),ad={},wd={};for(const[k,v]of Object.entries(oe.a))addDelta(ad,k,-v);for(const[k,v]of Object.entries(oe.w))addDelta(wd,k,-v);for(const[k,v]of Object.entries(ne.a))addDelta(ad,k,v);for(const[k,v]of Object.entries(ne.w))addDelta(wd,k,v);const bal=await applyBalanceChanges(ad,wd);if(!bal.ok)return alert(bal.error);let desc=eMoveDesc.value.trim();if(type==='WALLET_TRANSFER')desc=`WALLET_TRANSFER|${walletId}|${walletToId}|${desc}`;else if(type==='RICARICA'||type==='SPESA')desc=`WALLET_ADJUST|${desc}`;const row={movement_date:eMoveDate.value||today(),movement_type:type,amount,account_id:(type==='PRELIEVO'||type==='DEPOSITO')?accountId:null,wallet_id:walletId,description:desc};const r=await SUPA.from('tracker_movements').update(row).eq('id',id);if(r.error){await restoreBalanceChanges(bal);return alert(r.error.message)}closeModal();await loadAll()}async function deleteMovementOperation(id){const m=movements.find(x=>x.id===id);if(!m||!confirm('Eliminare questo movimento e ripristinare i saldi?'))return;const e=movementEffects(m),ad={},wd={};for(const[k,v]of Object.entries(e.a))addDelta(ad,k,-v);for(const[k,v]of Object.entries(e.w))addDelta(wd,k,-v);const bal=await applyBalanceChanges(ad,wd);if(!bal.ok)return alert(bal.error);const r=await SUPA.from('tracker_movements').delete().eq('id',id);if(r.error){await restoreBalanceChanges(bal);return alert(r.error.message)}await loadAll()}function openEditBet(id){const b=bets.find(x=>x.id===id);if(!b||isQuickBet(b)||isPBBet(b))return;showModal('Modifica puntata',`<div class="field"><label>Conto</label><select id="eBetAccount">${accountOpts(b.account_id)}</select></div><div class="row"><div class="field"><label>Data</label><input id="eBetDate" type="date" value="${esc(b.bet_date||today())}"></div><div class="field"><label>Puntata</label><input id="eBetStake" type="number" step="0.01" value="${Number(b.stake||0)}"></div><div class="field"><label>Quota</label><input id="eBetOdds" type="number" step="0.01" value="${Number(b.odds||0)}"></div></div><div class="field"><label>Evento</label><input id="eBetDesc" value="${esc(b.description||'')}"></div><div class="field"><label>Stato</label><select id="eBetStatus"><option value="PENDING" ${b.status==='PENDING'?'selected':''}>IN CORSO</option><option value="WIN" ${b.status==='WIN'?'selected':''}>WIN</option><option value="LOSS" ${b.status==='LOSS'?'selected':''}>LOSS</option><option value="VOID" ${b.status==='VOID'?'selected':''}>VOID</option></select></div><button class="btn gold" onclick="saveEditBet('${id}')">Salva modifica</button>`)}async function saveEditBet(id){const b=bets.find(x=>x.id===id);if(!b)return alert('Puntata non trovata');const accountId=eBetAccount.value,stake=Math.abs(Number(eBetStake.value||0)),odds=Number(eBetOdds.value||0),status=eBetStatus.value;if(!accountId||stake<=0||odds<=1)return alert('Dati non validi');let profit=0;if(status==='WIN')profit=stake*(odds-1);else if(status==='LOSS')profit=-stake;const nb={stake,odds,status,profit},ad={};addDelta(ad,b.account_id,-betBalanceEffect(b));addDelta(ad,accountId,betBalanceEffect(nb));const bal=await applyBalanceChanges(ad,{});if(!bal.ok)return alert(bal.error);const r=await SUPA.from('tracker_bets').update({account_id:accountId,bet_date:eBetDate.value||today(),description:eBetDesc.value.trim(),stake,odds,status,profit:Number(profit.toFixed(2))}).eq('id',id);if(r.error){await restoreBalanceChanges(bal);return alert(r.error.message)}closeModal();await loadAll()}function openEditQuickBet(id){const b=bets.find(x=>x.id===id);if(!b||!isQuickBet(b))return;const q=quickParts(b);showModal('Modifica giocata rapida',`<div class="field"><label>Conto</label><select id="eQuickAccount">${accountOpts(b.account_id)}</select></div><div class="row"><div class="field"><label>Metodo</label><select id="eQuickMethod"><option ${q.method==='SPORT'?'selected':''}>SPORT</option><option ${q.method==='CASINO'?'selected':''}>CASINO</option><option ${q.method==='SLOT'?'selected':''}>SLOT</option><option ${q.method==='BONUS'?'selected':''}>BONUS</option><option ${q.method==='ALTRO'?'selected':''}>ALTRO</option></select></div><div class="field"><label>Movimento (+/-)</label><input id="eQuickMove" type="number" step="0.01" value="${Number(b.profit||0)}"></div><div class="field"><label>Data</label><input id="eQuickDate" type="date" value="${esc(b.bet_date||today())}"></div></div><div class="field"><label>Note</label><input id="eQuickNote" value="${esc(q.note||'')}"></div><button class="btn gold" onclick="saveEditQuickBet('${id}')">Salva modifica</button>`)}async function saveEditQuickBet(id){const b=bets.find(x=>x.id===id);if(!b)return;const accountId=eQuickAccount.value,mv=Number(eQuickMove.value||0);if(!accountId||!Number.isFinite(mv)||mv===0)return alert('Movimento non valido');const ad={};addDelta(ad,b.account_id,-betBalanceEffect(b));addDelta(ad,accountId,mv);const bal=await applyBalanceChanges(ad,{});if(!bal.ok)return alert(bal.error);const r=await SUPA.from('tracker_bets').update({account_id:accountId,bet_date:eQuickDate.value||today(),description:`RAPIDA|${eQuickMethod.value}|${eQuickNote.value.trim()}`,stake:0,odds:0,status:mv>=0?'WIN':'LOSS',profit:mv}).eq('id',id);if(r.error){await restoreBalanceChanges(bal);return alert(r.error.message)}closeModal();await loadAll();showTab('rapide')}async function deleteBetOperation(id){const b=bets.find(x=>x.id===id);if(!b||!confirm('Eliminare questa operazione e ripristinare il saldo?'))return;const ad={};addDelta(ad,b.account_id,-betBalanceEffect(b));const bal=await applyBalanceChanges(ad,{});if(!bal.ok)return alert(bal.error);const r=await SUPA.from('tracker_bets').delete().eq('id',id);if(r.error){await restoreBalanceChanges(bal);return alert(r.error.message)}await loadAll()}function pbResult(g){if(g.punta.status==='PENDING'||g.banca.status==='PENDING')return'PENDING';return g.punta.status==='WIN'?'PUNTA':'BANCA'}function openEditPB(gid){const g=pbGroups(bets.filter(isPBBet)).find(x=>x.id===gid);if(!g)return alert('PB non trovata');const p=pbParts(g.punta),b=pbParts(g.banca),result=pbResult(g);showModal('Modifica Puntata PB',`<div class="field"><label>Evento</label><input id="epbEvent" value="${esc(p.event||'')}"></div><div class="field"><label>Data</label><input id="epbDate" type="date" value="${esc(g.punta.bet_date||today())}"></div><div class="field"><label>Conto PUNTA</label><select id="epbBackAccount">${accountOpts(g.punta.account_id)}</select></div><div class="row"><div class="field"><label>Stake Punta</label><input id="epbBackStake" type="number" step="0.01" value="${p.backStake}"></div><div class="field"><label>Quota Punta</label><input id="epbBackOdds" type="number" step="0.01" value="${p.backOdds}"></div></div><div class="field"><label>Conto BANCA / Exchange</label><select id="epbLayAccount">${accountOpts(g.banca.account_id)}</select></div><div class="row"><div class="field"><label>Importo Banca</label><input id="epbLayStake" type="number" step="0.01" value="${b.layStake}"></div><div class="field"><label>Quota Banca</label><input id="epbLayOdds" type="number" step="0.01" value="${b.layOdds}"></div><div class="field"><label>Commissione %</label><input id="epbComm" type="number" step="0.01" value="${b.commission}"></div></div><div class="field"><label>Stato PB</label><select id="epbResult"><option value="PENDING" ${result==='PENDING'?'selected':''}>IN CORSO</option><option value="PUNTA" ${result==='PUNTA'?'selected':''}>Vince PUNTA</option><option value="BANCA" ${result==='BANCA'?'selected':''}>Vince BANCA</option></select></div><button class="btn gold" onclick="saveEditPB('${gid}')">Salva modifica PB</button>`)}async function saveEditPB(gid){const g=pbGroups(bets.filter(isPBBet)).find(x=>x.id===gid);if(!g)return alert('PB non trovata');const event=epbEvent.value.trim(),date=epbDate.value||today(),backId=epbBackAccount.value,layId=epbLayAccount.value,bs=Math.abs(Number(epbBackStake.value||0)),bo=Number(epbBackOdds.value||0),ls=Math.abs(Number(epbLayStake.value||0)),lo=Number(epbLayOdds.value||0),comm=Number(epbComm.value||0),result=epbResult.value;if(!event||!backId||!layId||backId===layId||bs<=0||bo<=1||ls<=0||lo<=1||comm<0||comm>100)return alert('Controlla i dati PB');const liab=Number((ls*(lo-1)).toFixed(2)),meta=`${event}|${bs}|${bo}|${ls}|${lo}|${comm}`;let ps='PENDING',pp=0,lsStatus='PENDING',lp=0;if(result==='PUNTA'){ps='WIN';pp=bs*(bo-1);lsStatus='LOSS';lp=-liab}else if(result==='BANCA'){ps='LOSS';pp=-bs;lsStatus='WIN';lp=ls*(1-comm/100)}const np={account_id:backId,stake:bs,odds:bo,status:ps,profit:Number(pp.toFixed(2))},nl={account_id:layId,stake:liab,odds:lo,status:lsStatus,profit:Number(lp.toFixed(2))},ad={};addDelta(ad,g.punta.account_id,-betBalanceEffect(g.punta));addDelta(ad,g.banca.account_id,-betBalanceEffect(g.banca));addDelta(ad,backId,betBalanceEffect(np));addDelta(ad,layId,betBalanceEffect(nl));const bal=await applyBalanceChanges(ad,{});if(!bal.ok)return alert(bal.error);const oldP={account_id:g.punta.account_id,bet_date:g.punta.bet_date,description:g.punta.description,stake:g.punta.stake,odds:g.punta.odds,status:g.punta.status,profit:g.punta.profit},r1=await SUPA.from('tracker_bets').update({account_id:backId,bet_date:date,description:`PB|${gid}|PUNTA|${meta}`,stake:bs,odds:bo,status:ps,profit:Number(pp.toFixed(2))}).eq('id',g.punta.id);if(r1.error){await restoreBalanceChanges(bal);return alert(r1.error.message)}const r2=await SUPA.from('tracker_bets').update({account_id:layId,bet_date:date,description:`PB|${gid}|BANCA|${meta}`,stake:liab,odds:lo,status:lsStatus,profit:Number(lp.toFixed(2))}).eq('id',g.banca.id);if(r2.error){await SUPA.from('tracker_bets').update(oldP).eq('id',g.punta.id);await restoreBalanceChanges(bal);return alert(r2.error.message)}closeModal();await loadAll();showTab('pb')}async function deletePBOperation(gid){const g=pbGroups(bets.filter(isPBBet)).find(x=>x.id===gid);if(!g||!confirm('Eliminare tutta la PB e ripristinare entrambi i saldi?'))return;const ad={};addDelta(ad,g.punta.account_id,-betBalanceEffect(g.punta));addDelta(ad,g.banca.account_id,-betBalanceEffect(g.banca));const bal=await applyBalanceChanges(ad,{});if(!bal.ok)return alert(bal.error);const r=await SUPA.from('tracker_bets').delete().in('id',[g.punta.id,g.banca.id]);if(r.error){await restoreBalanceChanges(bal);return alert(r.error.message)}await loadAll();showTab('pb')}'''
          s=s.replace(marker,funcs+marker,1)
          p.write_text(s)
          PY
      - name: Verify JavaScript syntax and markers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('trackergatto-v2.html').read_text()
          js=s.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/tracker.js').write_text(js)
