name: Remove global TrackerGatto wallet seed
on:
  push:
    paths:
      - '.github/workflows/remove-global-wallet-seed.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Relax cleanup guard for copied wallets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('trackergatto-v2.html')
          s=p.read_text()
          old="if((h.data||[]).length||(a.data||[]).length||(m.data||[]).length||(b.data||[]).length||wallets.length!==seed.length)return;"
          new="if((m.data||[]).length||(b.data||[]).length||wallets.length!==seed.length)return;"
          if old not in s:
              raise SystemExit('cleanup guard marker missing')
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
      - name: Verify syntax and safety guards
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('trackergatto-v2.html').read_text()
          assert "if((m.data||[]).length||(b.data||[]).length||wallets.length!==seed.length)return;" in s
          assert "wallets.length!==seed.length" in s
          assert "actual.size!==expected.size" in s
          assert "await cleanupAccidentalSeedCopy();await loadAll()" in s
          js=s.split('<script>')[-1].split('</script>')[0]
          Path('/tmp/tracker.js').write_text(js)
          PY
          node --check /tmp/tracker.js
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add trackergatto-v2.html
          git commit -m "Clean copied wallets even after account setup"
          git pull --rebase origin main
          git push
