name: Switch Profit Tracker to TrackerGatto

on:
  push:
    paths:
      - 'trigger-trackergatto.txt'

permissions:
  contents: write

jobs:
  switch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Profit Tracker menu button
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<button onclick="openSection(\'profitTracker\')">Profit Tracker</button>'
          new = '<button onclick="window.location.href=\'trackergatto.html\'">🐱 TrackerGatto</button>'
          if old not in s:
              raise SystemExit('Profit Tracker button not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make TrackerGatto the main profit tracker"
          git push
