<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADF SIGNALS</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050b12;color:#fff;font-family:Inter,Arial,sans-serif}.wrap{height:100%;display:grid;grid-template-rows:auto 1fr}.stats{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:10px;padding:10px 14px;background:linear-gradient(180deg,#07131e,#050b12);border-bottom:1px solid #1d3042;align-items:stretch}.brand,.box{background:#0b1724;border:1px solid #1d3042;border-radius:10px;padding:10px 12px}.brand{display:flex;align-items:center;gap:10px}.logo{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;border:2px solid #36d65c;color:#36d65c;font-weight:900}.brand b{font-size:18px}.brand small{display:block;color:#8ca0b4;margin-top:2px}.box small{display:block;color:#8ca0b4;font-size:10px;text-transform:uppercase;font-weight:800}.box strong{display:block;margin-top:4px;font-size:20px}.win{color:#36d65c}.loss{color:#ff5b4f}.rate{color:#f6cc24}iframe{width:100%;height:100%;border:0;background:#050b12}@media(max-width:760px){.stats{grid-template-columns:1fr 1fr}.brand{grid-column:1/-1}.box strong{font-size:18px}}</style></head><body><div class="wrap"><div class="stats"><div class="brand"><div class="logo">ADF</div><div><b>ADF SIGNALS</b><small>Powered by SoccerTrend</small></div></div><div class="box"><small>Segnali totali</small><strong id="total">0</strong></div><div class="box"><small>WIN</small><strong id="wins" class="win">0</strong></div><div class="box"><small>LOSS</small><strong id="losses" class="loss">0</strong></div><div class="box"><small>Win rate</small><strong id="rate" class="rate">0%</strong></div></div><iframe src="soccertrend-pro.html" title="ADF Signals"></iframe></div><script>async function loadStats(){try{const r=await fetch('/api/soccertrend-stats',{cache:'no-store'}),d=await r.json();if(!d.success)return;document.getElementById('total').textContent=d.total;document.getElementById('wins').textContent=d.wins;document.getElementById('losses').textContent=d.losses;document.getElementById('rate').textContent=Number(d.winRate||0).toLocaleString('it-IT',{maximumFractionDigits:1})+'%'}catch(e){console.error(e)}}loadStats();setInterval(loadStats,60000)</script></body></html>
