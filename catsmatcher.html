<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Catsmatcher</title>

  <style>
    body{
      margin:0;
      font-family:Arial;
      background:#0b1220;
      color:white;
    }

    .container{
      max-width:1200px;
      margin:auto;
      padding:30px;
    }

    h1{text-align:center}

    .box{
      background:#111827;
      padding:20px;
      border-radius:12px;
      margin-bottom:20px;
    }

    input, select{
      width:100%;
      padding:10px;
      margin-bottom:10px;
      border-radius:8px;
      border:1px solid #333;
      background:#020617;
      color:white;
    }

    button{
      padding:12px;
      border:none;
      border-radius:8px;
      cursor:pointer;
      margin-right:10px;
    }

    .btn-main{background:#06b6d4;color:white}
    .btn-sec{background:#334155;color:white}

    table{
      width:100%;
      border-collapse:collapse;
    }

    th,td{
      padding:10px;
      border-bottom:1px solid #333;
    }

    th{background:#111827}

    .green{color:#22c55e}
    .red{color:#ef4444}

    .status{
      margin-top:10px;
      color:#cbd5e1;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Catsmatcher</h1>

  <div class="box">

    <input id="stakeInput" type="number" value="100" placeholder="Stake">

    <input id="dateInput" type="date">

    <select id="bookmakerInput">
      <option value="bet365">Bet365</option>
      <option value="unibet">Unibet</option>
    </select>

    <select id="sportInput">
      <option value="soccer_italy_serie_a">Serie A</option>
      <option value="soccer_epl">Premier League</option>
    </select>

    <input id="searchInput" placeholder="Cerca partita">

    <button class="btn-main" onclick="searchMatches()">Cerca</button>
    <button class="btn-sec" onclick="resetFilters()">Reset</button>

    <div id="status" class="status">Pronto</div>

  </div>

  <div class="box">

    <table>
      <thead>
        <tr>
          <th>Evento</th>
          <th>Data</th>
          <th>Book</th>
          <th>Esito</th>
          <th>Quota</th>
          <th>Ref</th>
          <th>Rating</th>
          <th>Profitto</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <tr><td colspan="8">Nessun dato</td></tr>
      </tbody>
    </table>

  </div>

</div>

<script>

function formatDate(d){
  return new Date(d).toLocaleString("it-IT");
}

function euro(v){
  return "€ " + Number(v).toFixed(2);
}

function render(rows){
  const body = document.getElementById("tableBody");

  if(!rows.length){
    body.innerHTML = `<tr><td colspan="8">Nessun risultato</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r=>`
    <tr>
      <td>${r.match}</td>
      <td>${formatDate(r.commence_time)}</td>
      <td>${r.bookmaker_title}</td>
      <td>${r.bet_label}</td>
      <td>${r.book_odds.toFixed(2)}</td>
      <td>${r.ref_odds.toFixed(2)}</td>
      <td>${r.rating.toFixed(2)}%</td>
      <td class="${r.estimated_profit >=0 ? 'green':'red'}">
        ${euro(r.estimated_profit)}
      </td>
    </tr>
  `).join("");
}

async function searchMatches(){

  const stake = document.getElementById("stakeInput").value;
  const until = document.getElementById("dateInput").value;
  const bookmaker = document.getElementById("bookmakerInput").value;
  const sport = document.getElementById("sportInput").value;
  const search = document.getElementById("searchInput").value;

  document.getElementById("status").innerText = "Caricamento...";
  document.getElementById("tableBody").innerHTML =
    `<tr><td colspan="8">Caricamento...</td></tr>`;

  try{

    const params = new URLSearchParams({
      stake, until, bookmaker, sport, search
    });

    const res = await fetch(`/api/catsmatcher?${params.toString()}`);

    const text = await res.text();

    let json;
    try{
      json = JSON.parse(text);
    }catch(e){
      throw new Error(text);
    }

    if(!res.ok){
      throw new Error(json.error || json.details);
    }

    render(json.rows);

    document.getElementById("status").innerText =
      "OK - " + json.rows.length + " risultati";

  }catch(err){
    console.error(err);
    document.getElementById("status").innerText = err;
    document.getElementById("tableBody").innerHTML =
      `<tr><td colspan="8">Errore</td></tr>`;
  }
}

function resetFilters(){
  document.getElementById("stakeInput").value = 100;
  document.getElementById("searchInput").value = "";
  document.getElementById("status").innerText = "Reset";
}

</script>

</body>
</html>
