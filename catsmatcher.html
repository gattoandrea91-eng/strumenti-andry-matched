<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CatsMatcher</title>

<style>
body{
  margin:0;
  font-family:Arial;
  background:#0b1220;
  color:white;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:30px 16px;
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.box{
  background:#111827;
  padding:20px;
  border-radius:16px;
  border:1px solid #334155;
  margin-bottom:20px;
}

input, select{
  width:100%;
  padding:12px;
  border-radius:10px;
  border:1px solid #334155;
  background:#020617;
  color:white;
}

.field{ margin-bottom:14px; }

button{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  cursor:pointer;
}

table{
  width:100%;
  border-collapse:collapse;
}

th, td{
  padding:10px;
  border-bottom:1px solid #334155;
  font-size:14px;
}

th{
  background:#1e293b;
}

.green{ color:#4ade80; }
.red{ color:#f87171; }

.pill{
  background:#1e293b;
  padding:4px 8px;
  border-radius:8px;
}

.back{
  margin-top:20px;
  background:#334155;
}
</style>
</head>

<body>

<div class="container">

<h1>CatsMatcher</h1>

<div class="box">
  <div class="field">
    <label>Stake</label>
    <input id="stake" type="number" value="100">
  </div>

  <div class="field">
    <label>Fino a data</label>
    <input id="until" type="date">
  </div>

  <div class="field">
    <label>Bookmaker</label>
    <select id="book">
      <option value="bet365">Bet365</option>
      <option value="williamhill">William Hill</option>
      <option value="sisal">Sisal</option>
    </select>
  </div>

  <button onclick="search()">CERCA</button>
</div>

<div class="box">
  <table>
    <thead>
      <tr>
        <th>Match</th>
        <th>Data</th>
        <th>Book</th>
        <th>Pick</th>
        <th>Copertura</th>
        <th>Quota</th>
        <th>Quota Ref</th>
        <th>Stake</th>
        <th>Stake Ref</th>
        <th>Profit Book</th>
        <th>Profit Ref</th>
        <th>Profit Min</th>
        <th>Stato</th>
      </tr>
    </thead>
    <tbody id="tableBody">
      <tr><td colspan="13">Nessun dato</td></tr>
    </tbody>
  </table>
</div>

<button class="back" onclick="history.back()">← Torna indietro</button>

</div>

<script>
async function search(){
  const stake = document.getElementById("stake").value;
  const until = document.getElementById("until").value;
  const book = document.getElementById("book").value;

  const params = new URLSearchParams({
    stake,
    until,
    bookmaker: book
  });

  const body = document.getElementById("tableBody");
  body.innerHTML = `<tr><td colspan="13">Caricamento...</td></tr>`;

  try{
    const res = await fetch(`/api/catsmatcher?${params}`);
    const text = await res.text();

    let data;
    try{
      data = JSON.parse(text);
    }catch(e){
      body.innerHTML = `<tr><td colspan="13">${text}</td></tr>`;
      return;
    }

    render(data.rows);

  }catch(err){
    body.innerHTML = `<tr><td colspan="13">Errore server</td></tr>`;
  }
}

function formatDate(d){
  if(!d) return "—";
  return new Date(d).toLocaleString("it-IT");
}

function euro(v){
  if(v == null) return "—";
  return "€ " + Number(v).toFixed(2);
}

function cls(v){
  if(v == null) return "";
  return Number(v) >= 0 ? "green" : "red";
}

function render(rows){
  const body = document.getElementById("tableBody");

  if(!rows || !rows.length){
    body.innerHTML = `<tr><td colspan="13">Nessun risultato</td></tr>`;
    return;
  }

  body.innerHTML = rows.map(r => `
    <tr>
      <td>${r.match || "—"}</td>
      <td>${formatDate(r.commence_time)}</td>
      <td>${r.bookmaker_title || "—"}</td>
      <td><span class="pill">${r.bet_label || "—"}</span></td>
      <td><span class="pill">${r.hedge_label || "—"}</span></td>
      <td>${Number(r.book_odds || 0).toFixed(2)}</td>
      <td>${r.ref_odds == null ? "—" : Number(r.ref_odds).toFixed(2)}</td>
      <td>${euro(r.stake_book)}</td>
      <td>${euro(r.stake_ref)}</td>
      <td class="${cls(r.profit_book)}">${euro(r.profit_book)}</td>
      <td class="${cls(r.profit_ref)}">${euro(r.profit_ref)}</td>
      <td class="${cls(r.profit_min)}">${euro(r.profit_min)}</td>
      <td>${r.status || "—"}</td>
    </tr>
  `).join("");
}
</script>

</body>
</html>
